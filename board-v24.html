<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피쉬코지 게시판</title>
<!-- v50: 게시판 전면 개편 — 목록 → 글 보기 → 글쓰기 한 화면씩. 서버(D1) 전용, 연결 실패 시 조용히 로컬 저장하지 않고 알려 줌. -->
<style>
:root{--bg:#fbf6ee;--card:#fff;--line:#eee3d3;--ink:#3d3a4b;--sub:#8a8296;--acc:#ff8a4c;--acc2:#ffeede;--ok:#4caf7a;--err:#e0564f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.dim{position:fixed;inset:0;background:rgba(40,30,50,.35)}
.win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);height:min(680px,90vh);background:var(--bg);border-radius:22px;box-shadow:0 20px 60px rgba(40,30,50,.35);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:700px){.win{width:100vw;height:100%;border-radius:0;left:0;top:0;transform:none}}
header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
header h1{margin:0;font-size:20px;font-weight:800;flex:1;display:flex;align-items:center;gap:8px}
.st{font-size:11.5px;font-weight:600;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.st i{width:7px;height:7px;border-radius:50%;background:var(--sub);display:inline-block}
.st.on i{background:var(--ok)}.st.off i{background:var(--err)}
.x{width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:20px;cursor:pointer;line-height:1}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 12px;flex:none}
@media (max-width:700px){.cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 88%,transparent)}}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;overflow:auto;padding:0 18px 18px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:#fff;box-shadow:0 1px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none}
.ico{width:16px;height:16px;flex:none}
.btn.pri{background:var(--acc);color:#fff;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.list{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.row{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:#fffaf3}
.row .t{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;min-width:0}
.row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--sub);margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px;cursor:pointer;min-width:0;font:inherit;color:inherit}
.ccard:hover{background:#fffaf3;border-color:var(--acc)}
.ccard img,.ccard .noimg{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#eef3f2;display:block}
.ccard b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard small{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.cats .chip{padding:6px 8px}.cats{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}@media (min-width:701px){.cats{gap:5px}}
.cnote{font-size:12px;color:var(--sub);margin:0 0 10px}
.post .cimg{display:block;width:min(260px,100%);aspect-ratio:1;object-fit:contain;border-radius:14px;background:#eef3f2;margin:10px 0}
.tag{font-style:normal;flex:none;font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--acc2);color:#c4612a}
.tag.n{background:#ffe1df;color:#c23b33}
.cnt{font-style:normal;flex:none;font-size:12px;color:var(--acc);font-weight:800}
.empty,.msg{padding:36px 16px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
.msg.err{color:var(--err)}
.more{display:block;margin:12px auto 0}
.back{border:0;background:none;color:var(--sub);font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:8px}
.post{background:#fff;border-radius:16px;border:1px solid var(--line);padding:16px}
.post h2{margin:8px 0 6px;font-size:19px;line-height:1.35;word-break:break-word}
.post .m{font-size:12.5px;color:var(--sub)}
.post .body{margin-top:14px;font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.cms{margin-top:14px}
.cms h3{font-size:14px;margin:0 0 8px}
.cm{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px;line-height:1.5;word-break:break-word}
.cm b{font-size:13px}.cm small{color:var(--sub);margin-left:6px}
.cbox{display:flex;gap:8px;margin-top:8px}
.cbox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.form label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}
.form select,.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.form textarea{min-height:180px;resize:vertical;line-height:1.6}
.form .hint{font-size:12px;color:var(--sub);margin-top:4px;text-align:right}
.form .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.who{font-size:12.5px;color:var(--sub);margin-top:2px}
.ptop{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}.ptop .back{margin:0}.pacts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}.pacts .btn{padding:7px 11px;font-size:13px}
.rpt{position:fixed;inset:0;background:rgba(40,30,50,.35);display:flex;align-items:center;justify-content:center;z-index:5}.rptc{background:#fff;border-radius:16px;padding:16px;width:min(340px,90vw);display:flex;flex-direction:column;gap:6px}.rptc .btn{width:100%;justify-content:flex-start;background:#fbf6ee}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3d3a4b;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.pimg{display:block;margin:12px 0;border-radius:14px;overflow:hidden;background:#f3ece0}.pimg img{display:block;width:100%;height:auto}
.wimg{margin-bottom:4px}.wpv{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.wpv img{max-width:100%;max-height:240px;border-radius:12px}
</style>
</head>
<body>
<div class="dim" data-close></div>
<div class="win" role="dialog" aria-label="게시판">
  <header>
    <h1>📋 게시판 <span class="st" id="st"><i></i><span>연결 중…</span></span></h1>
    <button class="x" data-close title="닫기 (Esc)" aria-label="닫기">×</button>
  </header>
  <nav class="cats" id="cats"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const CATS=[['공지','📢 공지'],['업데이트','🔔 업데이트'],['자유','💬 자유'],['질문','❓ 질문'],['자랑','🐟 자랑'],['공략','📚 공략'],['건의','💡 건의'],['버그제보','🐞 버그제보'],['창작','🧱 창작마당']];
const CRAFT=[['탈것','🐾 탈것'],['캐릭터','🧍 캐릭터'],['펫','🐶 펫']]; // v112: 편집기에서 올린 창작 마당 글 (보기·댓글)
const STAFF=new Set(['공지','업데이트']); // 운영자만 쓰는 게시판
const PAGE=30;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catKey=s=>String(s||'').replace(/[^가-힣]/g,'');
const catLabel=k=>(CATS.find(c=>c[0]===k)||[k,k])[1];
const P=(()=>{try{return parent!==window?parent:null;}catch(e){return null;}})();
function apiBase(){try{const q=new URLSearchParams(location.search).get('api');if(q)return q.replace(/\/$/,'');if(P&&P.NK_BOARD_API)return String(P.NK_BOARD_API).replace(/\/$/,'');}catch(e){}return 'https://fishcozy-board-api.mi1ku.workers.dev';}
function myNick(){try{const RT=P&&P.NK_RT;if(RT&&RT.serverNick)return String(RT.serverNick).slice(0,10);const S=P&&P.NKV2&&P.NKV2.S;if(S&&String(S.nick||'').trim())return String(S.nick).trim().slice(0,10);}catch(e){}return '낚시꾼';}
function adminToken(){try{const RT=P&&P.NK_RT;return RT&&RT.isAdmin&&RT.isAdmin()?String(RT.adminToken||''):'';}catch(e){return '';}}
function isStaff(){return !!adminToken();}
function ownerId(){try{return localStorage.getItem('nk_cid')||'';}catch(e){return '';}}
function bad(t){try{return !!(P&&P.NK_PROF&&P.NK_PROF.has&&P.NK_PROF.has(String(t||'')));}catch(e){return false;}}
const ERRMSG=e=>/bad image/.test(e.message)?'사진이 너무 크거나 지원하지 않는 형식이에요':/image limit/.test(e.message)?'사진은 하루 20장까지 올릴 수 있어요':/profanity/.test(e.message)?'비속어가 들어 있어 올릴 수 없어요':/admin only/.test(e.message)?'공지·업데이트와 운영자 닉네임은 관리자만 쓸 수 있어요':/not yours/.test(e.message)?'내가 쓴 글만 고칠 수 있어요':'처리하지 못했어요. 다시 시도해 주세요';
function when(ts){const t=+ts||0;if(!t)return '';const d=Date.now()-t;if(d<60e3)return '방금';if(d<3600e3)return Math.floor(d/60e3)+'분 전';if(d<86400e3)return Math.floor(d/3600e3)+'시간 전';const x=new Date(t);return (x.getMonth()+1)+'.'+x.getDate();}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1800);}
function close(){try{parent.postMessage('nkBoardClose','*');}catch(e){}}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
addEventListener('keydown',e=>{if(e.key==='Escape'){if(view!=='list'){showList();return;}close();}});

async function api(path,opt){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(apiBase()+path,Object.assign({signal:ctl.signal},opt||{},{headers:Object.assign({'Content-Type':'application/json'},ownerId()?{'X-Owner':ownerId()}:{},adminToken()?{'X-Admin-Token':adminToken()}:{},(opt&&opt.headers)||{})}));
    let j=null;try{j=await r.json();}catch(e){}
    if(!r.ok||!j||j.ok===false)throw new Error((j&&j.error)||('HTTP '+r.status));
    setStatus(true);return j;
  }catch(e){setStatus(false);throw e;}
  finally{clearTimeout(tm);}
}
function setStatus(ok){const s=$('#st');s.className='st '+(ok?'on':'off');s.lastElementChild.textContent=ok?'서버 연결됨':'서버 연결 안 됨';}

let cat='*',view='list',all=[],shown=PAGE,q='',loading=false,craft=null,csub='*';
function paintCats(){
  const cs=[['*','전체']].concat(CATS);
  $('#cats').innerHTML=cs.map(([k,l])=>`<button class="chip ${k===cat?'on':''}" data-c="${esc(k)}">${esc(l)}</button>`).join('');
  $('#cats').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;shown=PAGE;paintCats();showList();});
  const on=$('#cats .chip.on');if(on&&$('#cats').scrollWidth>$('#cats').clientWidth){const n=$('#cats');n.scrollLeft=Math.max(0,on.offsetLeft-n.clientWidth/2+on.offsetWidth/2);}
}
async function load(){
  loading=true;
  try{const j=await api('/posts?limit=100');all=(j.posts||[]).map(p=>({id:p.id,k:catKey(p.cat)||'자유',title:p.title,body:p.body,nick:p.nick,ts:p.created_at,cc:p.comment_count||0,mine:!!p.mine,ed:!!p.edited,rp:p.reports||0,hid:!!p.hidden,img:p.img||''}));return true;}
  catch(e){return false;}
  finally{loading=false;}
}
function filtered(){const s=q.trim().toLowerCase();return all.filter(p=>(cat==='*'||p.k===cat)&&(!s||(p.title+' '+p.body+' '+p.nick).toLowerCase().includes(s)));}
function canEd(){try{return !!(P&&P.NK_VBED&&((P.NK_VBUSER&&P.NK_VBUSER())||isStaff()));}catch(e){return false;}}
function craftHTML(){
  const s=q.trim().toLowerCase(),L=(craft||[]).filter(p=>(csub==='*'||p.sub===csub)&&(!s||(p.title+' '+p.body+' '+p.nick).toLowerCase().includes(s)));
  const sub=`<div class="csub">${[['*','전체']].concat(CRAFT).map(([k,l])=>`<button class="chip ${k===csub?'on':''}" data-cs="${esc(k)}">${esc(l)}</button>`).join('')}</div><p class="cnote">편집기에서 만든 탈것·캐릭터·펫을 구경하고 댓글을 남길 수 있어요${canEd()?' · <button class="chip" id="openEd">🧱 나도 만들기</button>':''}</p>`;
  if(!L.length)return sub+`<div class="list"><div class="empty">${q?'검색 결과가 없어요.':'아직 올라온 작품이 없어요.'}</div></div>`;
  return sub+`<div class="cgrid">${L.slice(0,shown).map(p=>`<button class="ccard" data-id="${esc(p.id)}">${p.img?`<img src="${esc(apiBase()+p.img)}" alt="" loading="lazy">`:'<i class="noimg"></i>'}<b>${esc(p.title)}</b><small>${esc((CRAFT.find(c=>c[0]===p.sub)||['',''])[1])} · ${esc(p.nick)}${p.cc?' · 💬 '+p.cc:''}</small></button>`).join('')}</div>${L.length>shown?'<button class="btn more" id="more">더 보기</button>':''}`;
}
async function loadCraft(){
  try{const js=await Promise.all(CRAFT.map(([k])=>api('/posts?limit=100&cat='+encodeURIComponent('창작·'+k)).then(j=>(j.posts||[]).map(p=>({id:p.id,k:'창작',sub:k,craft:1,title:p.title,body:p.body,nick:p.nick,ts:p.created_at,cc:p.comment_count||0,mine:!!p.mine,ed:!!p.edited,rp:p.reports||0,hid:!!p.hidden,img:p.img||''})))));craft=js.flat().sort((a,b)=>b.ts-a.ts);return true;}
  catch(e){return false;}
}
function listHTML(){
  if(cat==='창작')return craftHTML();
  const L=filtered();
  if(!L.length)return `<div class="list"><div class="empty">${q?'검색 결과가 없어요.':'아직 글이 없어요.<br>첫 글을 남겨 보세요!'}</div></div>`;
  return `<div class="list">${L.slice(0,shown).map(p=>`<button class="row" data-id="${esc(p.id)}"><div class="t"><em class="tag ${STAFF.has(p.k)?'n':''}">${esc(p.k)}</em><span>${esc(p.title)}</span>${p.img?'<em class="cnt" title="사진">📷</em>':''}${p.cc?`<em class="cnt">[${p.cc}]</em>`:''}${p.hid?'<em class="tag n">숨김</em>':''}${p.rp?`<em class="cnt" style="color:#e0564f">🚩${p.rp}</em>`:''}</div><div class="m">${esc(p.nick)}${p.mine?' · <b style="color:var(--acc)">내 글</b>':''} · ${esc(when(p.ts))}</div></button>`).join('')}</div>${L.length>shown?'<button class="btn more" id="more">더 보기</button>':''}`;
}
async function showList(reload){
  view='list';
  const m=$('#main');
  m.innerHTML=`<div class="bar"><input id="q" placeholder="제목·내용·닉네임 검색" value="${esc(q)}"><button class="btn pri" id="write"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>글쓰기</button></div><div id="lst"><div class="msg">불러오는 중…</div></div>`;
  $('#q').oninput=e=>{q=e.target.value;shown=PAGE;$('#lst').innerHTML=listHTML();bindRows();};
  $('#write').onclick=()=>showWrite();if(cat==='창작')$('#write').style.display='none';
  if(cat==='창작'){if(reload||!craft){const ok=await loadCraft();if(view!=='list')return;if(!ok){$('#lst').innerHTML=`<div class="list"><div class="msg err">게시판 서버에 연결하지 못했어요.<br><button class="btn" id="retry" style="margin-top:10px">다시 시도</button></div></div>`;$('#retry').onclick=()=>showList(true);return;}}$('#lst').innerHTML=listHTML();bindRows();m.scrollTop=0;return;}
  if(reload||!all.length){const ok=await load();if(view!=='list')return;if(!ok){$('#lst').innerHTML=`<div class="list"><div class="msg err">게시판 서버에 연결하지 못했어요.<br><button class="btn" id="retry" style="margin-top:10px">다시 시도</button></div></div>`;$('#retry').onclick=()=>showList(true);return;}}
  $('#lst').innerHTML=listHTML();bindRows();
  m.scrollTop=0;
}
function bindRows(){
  document.querySelectorAll('.row[data-id],.ccard[data-id]').forEach(r=>r.onclick=()=>showPost(r.dataset.id));
  const oe=document.getElementById('openEd');if(oe)oe.onclick=()=>{try{P.NK_BOARD&&P.NK_BOARD.close&&P.NK_BOARD.close();}catch(e){}try{P.NK_VBED.open();}catch(e){}};
  document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{csub=b.dataset.cs;shown=PAGE;$('#lst').innerHTML=listHTML();bindRows();});
  const mo=$('#more');if(mo)mo.onclick=()=>{shown+=PAGE;$('#lst').innerHTML=listHTML();bindRows();};
}
async function showPost(id){
  view='post';
  const p=all.concat(craft||[]).find(x=>x.id===id);if(!p)return showList(true);
  const m=$('#main');
  const acts=[p.mine&&!p.craft?'<button class="btn" id="pedit">✏️ 수정</button>':'',p.mine||isStaff()?'<button class="btn" id="pdel" style="color:#e0564f">🗑 삭제</button>':'',!p.mine?'<button class="btn" id="prep">🚩 신고</button>':'',isStaff()&&p.hid?'<button class="btn" id="punh">숨김 해제</button>':''].join('');
  m.innerHTML=`<div class="ptop"><button class="back" id="bk">← 목록</button><span class="pacts">${acts}</span></div><article class="post"><em class="tag ${STAFF.has(p.k)?'n':''}">${esc(p.craft?'창작·'+p.sub:p.k)}</em><h2>${esc(p.title)}</h2><div class="m">${esc(p.nick)} · ${esc(when(p.ts))}${p.ed?' · 수정됨':''}${isStaff()&&p.rp?` · 🚩 신고 ${p.rp}`:''}</div>${p.craft?(p.img?`<img class="cimg" src="${esc(apiBase()+p.img)}" alt="작품 미리보기">`:''):p.img?`<a class="pimg" href="${esc(apiBase()+p.img)}" target="_blank" rel="noopener"><img src="${esc(apiBase()+p.img)}" alt="첨부 사진" loading="lazy"></a>`:''}<div class="body">${esc(p.body)}</div></article><section class="cms"><h3>댓글</h3><div id="cml"><div class="msg">불러오는 중…</div></div><div class="cbox"><input id="cin" maxlength="200" placeholder="${esc(myNick())}(으)로 댓글 남기기"><button class="btn pri" id="cgo">등록</button></div></section>`;
  m.scrollTop=0;
  $('#bk').onclick=()=>showList();
  const paint=async()=>{
    try{const j=await api('/posts/'+encodeURIComponent(id));const cms=j.comments||[];p.cc=cms.length;if(view!=='post')return;
      $('#cml').innerHTML=cms.length?cms.map(c=>`<div class="cm"><b>${esc(c.nick)}</b><small>${esc(when(c.created_at))}</small>${c.mine||isStaff()?`<button class="back" data-cdel="${esc(c.id)}" style="float:right;color:#e0564f;margin:0">삭제</button>`:''}<div>${esc(c.body)}</div></div>`).join(''):'<div class="msg" style="padding:14px">첫 댓글을 남겨 보세요.</div>';}
    catch(e){if(view==='post')$('#cml').innerHTML='<div class="msg err" style="padding:14px">댓글을 불러오지 못했어요.</div>';}
  };
  paint();
  const pe=$('#pedit');if(pe)pe.onclick=()=>showWrite(p);
  const pr=$('#prep');if(pr)pr.onclick=()=>reportPost(p);
  const pu=$('#punh');if(pu)pu.onclick=async()=>{try{await api('/posts/'+encodeURIComponent(id)+'/unhide',{method:'POST'});p.hid=false;p.rp=0;toast('숨김을 풀었어요');showPost(id);}catch(e){toast(ERRMSG(e));}};
  const pd=$('#pdel');if(pd)pd.onclick=async()=>{if(!confirm('이 글을 삭제할까요? 댓글도 함께 지워져요'))return;try{await api('/posts/'+encodeURIComponent(id),{method:'DELETE'});all=all.filter(x=>x.id!==id);if(craft)craft=craft.filter(x=>x.id!==id);toast('글을 삭제했어요');showList();}catch(e){toast('삭제하지 못했어요');}};
  $('#cml').addEventListener('click',async e=>{const b=e.target.closest('[data-cdel]');if(!b)return;if(!confirm('이 댓글을 삭제할까요?'))return;try{await api('/comments/'+encodeURIComponent(b.dataset.cdel),{method:'DELETE'});await paint();}catch(err){toast('삭제하지 못했어요');}});
  const go=async()=>{const inp=$('#cin'),v=inp.value.trim();if(!v)return;if(bad(v))return toast('비속어가 들어 있어 올릴 수 없어요');$('#cgo').disabled=true;
    try{await api('/posts/'+encodeURIComponent(id)+'/comments',{method:'POST',body:JSON.stringify({body:v,nick:myNick()})});inp.value='';await paint();}
    catch(e){toast(ERRMSG(e));}
    finally{const b=$('#cgo');if(b)b.disabled=false;}};
  $('#cgo').onclick=go;$('#cin').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go();}};
}
function reportPost(p){
  const m=$('#main'),box=document.createElement('div');box.className='rpt';
  box.innerHTML=`<div class="rptc"><b>🚩 이 글을 신고할까요?</b><p class="m">이유를 골라 주세요. 여러 명이 신고하면 관리자가 확인할 때까지 숨겨져요.</p>${['욕설·비하','도배·광고','개인정보 노출','음란·불쾌','기타'].map(r=>`<button class="btn" data-r="${r}">${r}</button>`).join('')}<button class="btn" data-x style="margin-top:6px">취소</button></div>`;
  m.appendChild(box);
  box.onclick=async e=>{if(e.target===box||e.target.closest('[data-x]')){box.remove();return;}const b=e.target.closest('[data-r]');if(!b)return;
    try{const j=await api('/posts/'+encodeURIComponent(p.id)+'/report',{method:'POST',body:JSON.stringify({reason:b.dataset.r})});toast(j.already?'이미 신고한 글이에요':'신고했어요. 확인 후 조치할게요');}catch(err){toast(/own post/.test(err.message)?'내 글은 신고할 수 없어요':ERRMSG(err));}box.remove();};
}
function showWrite(edit){
  view='write';
  const staff=isStaff(),def=edit?edit.k:cat!=='*'&&cat!=='창작'&&(staff||!STAFF.has(cat))?cat:'자유';
  const opts=CATS.filter(([k])=>k!=='창작'&&(staff||!STAFF.has(k))).map(([k,l])=>`<option value="${esc(k)}" ${k===def?'selected':''}>${esc(l)}</option>`).join('');
  const m=$('#main');
  m.innerHTML=`<button class="back" id="bk">← 목록</button><div class="form"><div class="who">${edit?'글 수정':esc(myNick())+'(으)로 글을 써요'}</div><label for="wc">게시판</label><select id="wc">${opts}</select><label for="wt">제목</label><input id="wt" maxlength="60" placeholder="제목을 입력하세요">${edit?'':`<label>사진 <small style="font-weight:400;color:var(--sub)">(1장 · 게임에서 Print Screen으로 찍은 사진은 자동으로 들어와요)</small></label><div class="wimg" id="wimg"></div>`}<label for="wb">내용</label><textarea id="wb" maxlength="2000" placeholder="내용을 입력하세요"></textarea><div class="hint"><span id="wn">0</span>/2000</div><div class="acts"><button class="btn" id="wx">취소</button><button class="btn pri" id="wgo">${edit?'수정 완료':'등록'}</button></div></div>`;
  let img='';const paintImg=()=>{const w=$('#wimg');if(!w)return;w.innerHTML=img?`<div class="wpv"><img src="${img}" alt=""><button class="btn" id="wimx" type="button">✕ 사진 빼기</button></div>`:`<label class="btn" for="wfile">📷 사진 고르기</label><input type="file" id="wfile" accept="image/*" hidden>`;const x=$('#wimx');if(x)x.onclick=()=>{img='';paintImg();};const f=$('#wfile');if(f)f.onchange=async()=>{const fl=f.files&&f.files[0];if(!fl)return;try{img=await shrink(fl);paintImg();}catch(e){toast('사진을 읽지 못했어요');}};};
  if(draft&&!edit){img=draft.img||'';$('#wc').value='자랑';if(draft.title)$('#wt').value=draft.title;draft=null;}paintImg();
  if(edit){$('#wt').value=edit.title;$('#wb').value=edit.body;$('#wn').textContent=edit.body.length;}
  m.scrollTop=0;
  $('#bk').onclick=$('#wx').onclick=()=>edit?showPost(edit.id):showList();
  $('#wb').oninput=e=>{$('#wn').textContent=e.target.value.length;};
  $('#wt').focus();
  $('#wgo').onclick=async()=>{
    const title=$('#wt').value.trim(),body=$('#wb').value.trim(),k=$('#wc').value;
    if(!title)return toast('제목을 입력해 주세요');if(!body)return toast('내용을 입력해 주세요');
    if(bad(title)||bad(body))return toast('비속어가 들어 있어 올릴 수 없어요');
    $('#wgo').disabled=true;
    if(edit){try{await api('/posts/'+encodeURIComponent(edit.id),{method:'PUT',body:JSON.stringify({cat:k,title,body})});Object.assign(edit,{k,title,body,ed:true});toast('수정했어요');showPost(edit.id);}catch(e){toast(ERRMSG(e));$('#wgo').disabled=false;}return;}
    try{const j=await api('/posts',{method:'POST',body:JSON.stringify(Object.assign({cat:k,title,body,nick:myNick()},img?{img}:{}))});
      const p=j.post||{};all.unshift({id:p.id,k,title,body,nick:p.nick||myNick(),ts:p.created_at||Date.now(),cc:0,mine:true,img:p.img||''});
      cat=k;paintCats();toast('글을 올렸어요');showPost(p.id);}
    catch(e){toast(ERRMSG(e));$('#wgo').disabled=false;}
  };
}
// v80: 게임에서 찍은 스크린샷을 자랑 게시판 글쓰기로 바로 가져와요 (같은 사이트 localStorage · 10분 안의 것만)
let draft=null;try{const d=JSON.parse(localStorage.getItem('nk_board_draft')||'null');localStorage.removeItem('nk_board_draft');if(d&&d.img&&Date.now()-(d.t||0)<600e3)draft=d;}catch(e){}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.85,out=c.toDataURL('image/jpeg',q);while(out.length>600*1024&&q>.4){q-=.1;out=c.toDataURL('image/jpeg',q);}res(out);};im.onerror=rej;im.src=u;});}
paintCats();if(draft){cat='자랑';paintCats();showWrite();load();}else showList(true);
})();
</script>
