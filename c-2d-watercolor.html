<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>낚멍 시안 C - 2.5D 수채화 일러스트 레이어</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}</style></head><body>
<canvas id="c"></canvas><script src="common.js"></script><script>
NK.init({style:'시안 C · 2.5D 수채화 일러스트 패럴랙스 (Canvas2D)',dragHint:'마우스 드래그로 시점 패닝'});
const cv=document.getElementById('c'),x=cv.getContext('2d');let W,Hh,DPR=Math.min(devicePixelRatio,1.5);
function rs(){W=innerWidth;Hh=innerHeight;cv.width=W*DPR;cv.height=Hh*DPR;x.setTransform(DPR,0,0,DPR,0,0);build();}
const WORLD=2400;// 좌표: wx(0~2400), d 깊이(0=앞 화면하단, 1=호숫가, 1~2.2=데크 위 호수쪽)
const decks=[{x:500,mine:1},{x:1050},{x:1600},{x:2050}];const SH={x:250},SHOP={x:1330};
const P=[{sky1:'#bfe3f2',sky2:'#f4f1e6',m1:'#9fb8c4',m2:'#7f9fa0',m3:'#6a8f6a',water:'#8cc0c8',wd:'#5f9aa8',grass:'#a6c48a',sun:'#fffbe8',mist:.35,glow:0},
 {sky1:'#f29a7a',sky2:'#ffe0a8',m1:'#c49ab0',m2:'#a07a90',m3:'#6a6a7a',water:'#e8a890',wd:'#8a6a8a',grass:'#a8a070',sun:'#ffc070',mist:.3,glow:.4},
 {sky1:'#0c1530',sky2:'#2a3560',m1:'#2a3558',m2:'#1f2a48',m3:'#18233a',water:'#26365e',wd:'#141e3a',grass:'#2a3a3a',sun:'#e8ecff',mist:.22,glow:1}];
// 수채화 종이 텍스처 & 붓터치 산 레이어 프리렌더
let paper,layers=[];const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(11);
function build(){paper=document.createElement('canvas');paper.width=256;paper.height=256;const p=paper.getContext('2d');const id=p.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=200+Math.random()*55;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=22;}p.putImageData(id,0,0);paper=x.createPattern(paper,'repeat');}
const ridge=(seed,amp,base,n)=>{const r=[];let s=seed;for(let i=0;i<=n;i++){s=(s*9301+49297)%233280;r.push(base-amp*(.5+.5*Math.sin(i*.7+seed))*(.6+.4*s/233280));}return r;};
const R1=ridge(3,120,0,40),R2=ridge(7,80,0,40),R3=ridge(13,50,0,60);
const trees=[...Array(70)].map((_,i)=>({x:rnd()*WORLD,s:.6+rnd()*.8,c:rnd()}));
const me={x:520,d:.6,dir:1};const fl=[...Array(60)].map(()=>({x:Math.random()*WORLD,y:Math.random(),p:Math.random()*6}));
const mist=[...Array(14)].map((_,i)=>({x:Math.random()*WORLD,y:Math.random(),w:300+Math.random()*300,v:5+Math.random()*10}));
const fish=[...Array(10)].map(()=>({x:Math.random()*WORLD,y:.2+Math.random()*.7,v:(Math.random()-.5)*30}));
let camX=me.x,pan=0,drag=null,T=0,last=performance.now(),bob=null;const rip=[];
// 투영: 수평선 horizon(화면 42%), 호숫가 shore(70%), 앞 바닥 100%
const HZ=()=>Hh*.42,SHY=()=>Hh*.7;
function proj(wx,d){// d<=1: 땅(앞->호숫가), d>1: 호수 위(데크)
 const y=d<=1?Hh-(Hh-SHY())*d:SHY()-(SHY()-HZ())*(1-Math.pow(1-(d-1)/2.6,1.6));const sc=d<=1?1-.25*d:.75*(1-(d-1)/3.2);return{x:(wx-camX)*(d<=1?1:.9+(.1*(1-(d-1)/2.6)))+W/2,y,s:sc};}
const onDeck=(wx,d)=>decks.some(k=>Math.abs(wx-k.x)<38&&d>0.95&&d<2.2);
const walk=(wx,d)=>wx>20&&wx<WORLD-20&&d>=.05&&(d<=1||onDeck(wx,d))&&!(Math.abs(wx-SHOP.x)<70&&d>.75&&d<=1);
const nearTip=()=>decks.some(k=>Math.abs(me.x-k.x)<30&&me.d>2.0);
const spots=[{x:1050,y:2.1},{x:1600,y:2.1},{x:2050,y:2.05},{x:230,y:.5},{x:290,y:.35},{x:1330,y:.4},{x:800,y:.3}];
const bots=NK.makeBots(6,i=>spots[i]);const bwalk=(a,b)=>walk(a,b);
NK.onCast=()=>{bob={sx:me.x,sd:me.d,tx:me.x+(Math.random()-.5)*60,td:2.55,k:0};};NK.onReel=()=>bob=null;
cv.addEventListener('pointerdown',e=>drag={x:e.clientX,m:0});addEventListener('pointermove',e=>{if(!drag)return;pan=Math.max(-300,Math.min(300,pan-(e.clientX-drag.x)));drag.m+=Math.abs(e.clientX-drag.x);drag.x=e.clientX;});
addEventListener('pointerup',e=>{if(drag&&drag.m<5&&e.target===cv){const t=proj(decks[0].x+24,1.3);if(Math.hypot(e.clientX-t.x,e.clientY-t.y)<35)NK.toast('🐠 내 어항: '+(Object.keys(NK.dex).join(', ')||'아직 비어있어요')+'<br><small>다른 유저는 클릭해서 구경·거래</small>',2500);else if(NK.fishing.state!=='off')NK.fishing.action();}drag=null;});
const KC=[['#6a8fc0','#3a2a1a',1],['#e09aa8','#5a3a2a',1],['#7abf7a','#2a1a0a',.72],['#f0c86a','#7a4a2a',.72]];
function wash(c,a){x.globalAlpha=a;x.fillStyle=c;}
function person(wx,d,k,dir,t,moving,sit,rod,name){const p=proj(wx,d),s=p.s*KC[k][2]*(Hh/800)*1.25,[c,h]=KC[k];x.save();x.translate(p.x,p.y);x.scale(s*dir,s);
 x.globalAlpha=.25;x.fillStyle='#000';x.beginPath();x.ellipse(0,0,26,7,0,0,7);x.fill();x.globalAlpha=1;const b=moving?Math.sin(t*10)*8:0,sy=sit?18:0;
 x.strokeStyle='#4a4a5a';x.lineWidth=9;x.lineCap='round';x.beginPath();if(sit){x.moveTo(-5,-30);x.lineTo(14,-22);x.lineTo(16,0);}else{x.moveTo(-4,-40);x.lineTo(-4+b,0);x.moveTo(4,-40);x.lineTo(4-b,0);}x.stroke();
 x.fillStyle=c;x.beginPath();x.roundRect(-14,-92+sy,28,56,12);x.fill();x.fillStyle='#f5d6b8';x.beginPath();x.arc(0,-108+sy,17,0,7);x.fill();x.fillStyle=h;x.beginPath();x.arc(-2,-113+sy,17,Math.PI*.9,Math.PI*2.05);x.fill();if(k%2){x.fillRect(-18,-112+sy,8,30);}
 x.fillStyle='#333';x.beginPath();x.arc(8,-108+sy,2,0,7);x.fill();
 let tip=null;if(rod){x.strokeStyle='#5a3e22';x.lineWidth=3;x.beginPath();x.moveTo(10,-60+sy);x.lineTo(70,-150+sy);x.stroke();tip=[p.x+70*s*dir,p.y+(-150+sy)*s];}
 x.restore();x.font=`${Math.max(11,14*p.s)}px sans-serif`;x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#0006';x.lineWidth=3;const ny=p.y-140*s*1.05;x.strokeText(name,p.x,ny);x.fillText(name,p.x,ny);
 const bb=NK.lastBubble(name);if(bb){const w=x.measureText(bb).width+16;x.fillStyle='#fffe';x.beginPath();x.roundRect(p.x-w/2,ny-34,w,24,12);x.fill();x.fillStyle='#333';x.fillText(bb,p.x,ny-17);}return tip;}
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;NK.time.update(dt);NK.fishing.update(dt);const p=NK.palette(P);
 const mv=NK.move(),fishing=NK.fishing.state!=='off';let moving=false;
 if((mv.x||mv.y)&&!fishing){NK.sitting=false;const nx=me.x+mv.x*220*dt,nd=me.d+mv.y*.9*dt;if(walk(nx,me.d))me.x=nx;if(walk(me.x,nd))me.d=nd;if(mv.x)me.dir=mv.x>0?1:-1;moving=true;pan*=.95;}
 NK.nearSpot=nearTip();camX+=(me.x+pan-camX)*.08;
 // 하늘
 let g=x.createLinearGradient(0,0,0,HZ());g.addColorStop(0,p.sky1);g.addColorStop(1,p.sky2);x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,0,W,HZ()+2);
 const sunY=HZ()*(.25+.6*(NK.time.t%(1/3))*3*(p.night>.5?0:1));x.fillStyle=p.sun;x.globalAlpha=.9;x.beginPath();x.arc(W*.7-camX*.02,p.night>.5?HZ()*.25:sunY,28,0,7);x.fill();
 if(p.night>.3){x.fillStyle='#fff';for(let i=0;i<70;i++){x.globalAlpha=p.night*(.3+.7*Math.abs(Math.sin(T+i)));x.fillRect((i*137%W),(i*71%(HZ()*.8)),1.5,1.5);}}
 // 산 레이어(패럴랙스, 수채 번짐 = 반투명 여러겹)
 const mount=(R,par,col,h)=>{for(let k=0;k<3;k++){wash(col,.35);x.beginPath();x.moveTo(0,HZ());const step=W/(R.length-8);for(let i=0;i<R.length;i++){const sx=i*step-((camX*par)%step)-step*2;x.lineTo(sx,HZ()+R[(i+Math.floor(camX*par/step))%R.length]*h/100+k*4);}x.lineTo(W,HZ());x.fill();}};
 mount(R1,.05,p.m1,Hh/600*100);mount(R2,.12,p.m2,Hh/600*80);
 // 호수 (수평선~호숫가)
 g=x.createLinearGradient(0,HZ(),0,SHY());g.addColorStop(0,p.water);g.addColorStop(1,p.wd);x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,HZ(),W,SHY()-HZ());
 // 반사: 산 뒤집기 + 흔들림
 x.save();x.globalAlpha=.25;x.translate(0,HZ()*2);x.scale(1,-1);mount(R2,.12,p.m2,Hh/600*80);x.restore();
 x.globalAlpha=.5;x.fillStyle=p.sun;for(let i=0;i<14;i++){const yy=HZ()+i*i*1.5+4,ww=30-i+Math.sin(T*2+i)*8;x.fillRect(W*.7-camX*.02-ww/2+Math.sin(T+i)*4,yy,ww,2);}
 // 잔물결 선
 x.strokeStyle='#ffffff';for(let i=0;i<40;i++){const d=1+((i*.37+T*.02)%1)*2.6,pp=proj(((i*211)%WORLD),d);x.globalAlpha=.25*pp.s;x.beginPath();x.moveTo(pp.x-20*pp.s+Math.sin(T+i)*10,pp.y);x.lineTo(pp.x+20*pp.s+Math.sin(T+i)*10,pp.y);x.stroke();}
 fish.forEach(f=>{f.x+=f.v*dt;if(f.x<0||f.x>WORLD)f.v*=-1;const pp=proj(f.x,1.2+f.y*1.8);x.globalAlpha=.2;x.fillStyle='#123';x.beginPath();x.ellipse(pp.x,pp.y,12*pp.s,3*pp.s,0,0,7);x.fill();});
 // 먼 숲 실루엣
 mount(R3,.4,p.m3,Hh/600*25);
 // 데크
 decks.forEach(k=>{const a=proj(k.x-38,1),b=proj(k.x+38,1),c=proj(k.x+38,2.25),d=proj(k.x-38,2.25);x.globalAlpha=1;x.fillStyle='#a77d52';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(c.x,c.y);x.lineTo(d.x,d.y);x.fill();
  x.strokeStyle='#7a5636';x.lineWidth=1;for(let i=1;i<10;i++){const q=1+i*.125,l=proj(k.x-38,q),r=proj(k.x+38,q);x.beginPath();x.moveTo(l.x,l.y);x.lineTo(r.x,r.y);x.stroke();}
  x.globalAlpha=.25;x.fillStyle='#3a2a1a';x.fillRect(d.x,d.y,c.x-d.x,8);
  const L=proj(k.x-34,2.2);x.globalAlpha=1;x.fillStyle='#3a2a1a';x.fillRect(L.x,L.y-40*L.s,3,40*L.s);x.fillStyle='#ffd27a';x.beginPath();x.arc(L.x+1,L.y-44*L.s,6*L.s,0,7);x.fill();
  if(k.mine){const t=proj(k.x+24,1.3);x.fillStyle='#bfe8ffaa';x.fillRect(t.x-22,t.y-28,44,28);x.strokeStyle='#fff';x.strokeRect(t.x-22,t.y-28,44,28);x.fillStyle='#ff8a3a';x.beginPath();x.ellipse(t.x+Math.sin(T)*12,t.y-14,6,3,0,0,7);x.fill();}});
 // 땅(앞)
 g=x.createLinearGradient(0,SHY(),0,Hh);g.addColorStop(0,p.grass);g.addColorStop(1,NK.lerpC(p.grass,'#203020',.4));x.globalAlpha=1;x.fillStyle=g;x.beginPath();x.moveTo(0,SHY());for(let i=0;i<=40;i++){const sx=i*W/40;x.lineTo(sx,SHY()+Math.sin((sx+camX)*.02)*4);}x.lineTo(W,Hh);x.lineTo(0,Hh);x.fill();
 decks.forEach(k=>{const a=proj(k.x-38,1),b=proj(k.x+38,1),f0=proj(k.x-38,.85),f1=proj(k.x+38,.85);x.fillStyle='#a77d52';x.beginPath();x.moveTo(a.x,a.y-2);x.lineTo(b.x,b.y-2);x.lineTo(f1.x,f1.y);x.lineTo(f0.x,f0.y);x.fill();});
 // 쉼터 & 상점
 const sp=proj(SH.x,.45);x.fillStyle='#6a4a2a';x.fillRect(sp.x-60,sp.y-12,40,8);x.fillRect(sp.x+20,sp.y-12,40,8);
 for(let i=0;i<5;i++){x.globalAlpha=.8;x.fillStyle=['#ff5a2a','#ffa040','#ffe080'][i%3];x.beginPath();x.ellipse(sp.x+(i-2)*4,sp.y-14-Math.random()*10,6-i*.5,14+Math.random()*10,0,0,7);x.fill();}
 const so=proj(SHOP.x,.9);x.globalAlpha=1;x.fillStyle='#f0dcb8';x.fillRect(so.x-70,so.y-110,140,110);x.fillStyle='#d0705a';x.beginPath();x.moveTo(so.x-85,so.y-108);x.lineTo(so.x,so.y-160);x.lineTo(so.x+85,so.y-108);x.fill();
 x.fillStyle='#6a4a2a';x.fillRect(so.x-14,so.y-50,28,50);x.fillStyle=p.night>.3?'#ffd27a':'#9fc8d8';x.fillRect(so.x-55,so.y-80,28,22);x.fillRect(so.x+27,so.y-80,28,22);x.fillStyle='#5a3e22';x.font='bold 14px sans-serif';x.textAlign='center';x.fillText('작은 상점',so.x,so.y-90);
 // 캐릭터들 (깊이 정렬)
 NK.updateBots(dt,()=>spots[Math.random()*spots.length|0],bwalk);
 const ents=bots.map(b=>({d:b.y,f:()=>person(b.x,b.y,b.kind,(b.tx>=b.x)?1:-1,T+b.kind,b.moving,!b.moving&&b.wait>2,!b.moving&&b.y>2,b.name)}));
 let rodTip=null;ents.push({d:me.d,f:()=>{rodTip=person(me.x,me.d,0,me.dir,T,moving,NK.sitting||fishing,fishing,'나');}});
 ents.sort((a,b)=>b.d-a.d).forEach(e=>e.f());
 // 찌/줄
 if(bob&&rodTip){bob.k=Math.min(1,bob.k+dt*1.4);const wx=bob.sx+(bob.tx-bob.sx)*bob.k,dd=bob.sd+(bob.td-bob.sd)*bob.k,bp=proj(wx,dd);let by=bp.y-Math.sin(bob.k*Math.PI)*120;
  if(bob.k>=1){const bite=NK.fishing.state==='bite';by+=bite?Math.sin(T*25)*4+3:Math.sin(T*2)*1.5;if(Math.random()<(bite?.25:.03))rip.push({x:bp.x,y:bp.y,r:2});}
  x.globalAlpha=.7;x.strokeStyle='#fff';x.lineWidth=1;x.beginPath();x.moveTo(rodTip[0],rodTip[1]);x.quadraticCurveTo((rodTip[0]+bp.x)/2,by-20,bp.x,by);x.stroke();x.globalAlpha=1;x.fillStyle='#ff4a3a';x.beginPath();x.arc(bp.x,by,4,0,7);x.fill();}
 rip.forEach(r=>{r.r+=dt*25;x.globalAlpha=Math.max(0,.6-r.r/40);x.strokeStyle='#fff';x.beginPath();x.ellipse(r.x,r.y,r.r,r.r*.3,0,0,7);x.stroke();});while(rip.length&&rip[0].r>24)rip.shift();
 // 앞 나무(전경 패럴랙스 1.3배)
 trees.forEach(t=>{const tx=(t.x-camX)*1.3+W/2;if(tx<-200||tx>W+200||t.c>.35)return;const s=t.s*Hh/700;x.globalAlpha=.85;x.fillStyle=NK.lerpC(p.m3,'#2a4a2a',.3);for(let k=0;k<3;k++){x.beginPath();x.ellipse(tx+(k-1)*30*s,Hh-160*s-k*40*s,70*s,90*s,0,0,7);x.fill();}x.fillStyle='#3a2a1a';x.fillRect(tx-8*s,Hh-100*s,16*s,100*s);});
 // 물안개 (부드러운 띠)
 mist.forEach(m=>{m.x+=m.v*dt;if(m.x>WORLD+300)m.x=-300;const pp=proj(m.x,1.4+m.y);const gg=x.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,m.w*pp.s);gg.addColorStop(0,'rgba(255,255,255,1)');gg.addColorStop(1,'rgba(255,255,255,0)');x.globalAlpha=p.mist;x.fillStyle=gg;x.save();x.translate(0,pp.y);x.scale(1,.18);x.translate(0,-pp.y);x.fillRect(pp.x-m.w,pp.y-m.w,m.w*2,m.w*2);x.restore();});
 // 밤 어둠 + 불빛
 if(p.night>.05){x.globalAlpha=p.night*.45;x.fillStyle='#050a20';x.fillRect(0,0,W,Hh);x.globalCompositeOperation='lighter';const lights=[[sp.x,sp.y-20,200,'255,140,60'],...decks.map(k=>{const L=proj(k.x-34,2.2);return[L.x,L.y-44*L.s,70,'255,210,120'];}),[so.x-41,so.y-70,60,'255,210,120'],[so.x+41,so.y-70,60,'255,210,120']];
  lights.forEach(([lx,ly,r,c])=>{const gg=x.createRadialGradient(lx,ly,0,lx,ly,r*(1+Math.sin(T*10)*.03));gg.addColorStop(0,`rgba(${c},.5)`);gg.addColorStop(1,`rgba(${c},0)`);x.globalAlpha=p.night;x.fillStyle=gg;x.fillRect(lx-r,ly-r,r*2,r*2);});
  fl.forEach(f=>{f.p+=dt;const fx=((f.x-camX+Math.sin(f.p)*20)%W+W)%W,fy=HZ()+f.y*(Hh-HZ())+Math.cos(f.p*.7)*10;x.globalAlpha=p.night*(.5+.5*Math.sin(f.p*3));x.fillStyle='#fff27a';x.beginPath();x.arc(fx,fy,2,0,7);x.fill();});x.globalCompositeOperation='source-over';}
 // 수채 종이 질감
 x.globalAlpha=1;x.globalCompositeOperation='multiply';x.fillStyle=paper;x.fillRect(0,0,W,Hh);x.globalCompositeOperation='source-over';
 // 비네팅
 g=x.createRadialGradient(W/2,Hh/2,Hh*.4,W/2,Hh/2,Hh);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(60,40,30,.35)');x.fillStyle=g;x.fillRect(0,0,W,Hh);
 requestAnimationFrame(frame);}
rs();addEventListener('resize',rs);requestAnimationFrame(frame);
</script></body></html>
