<canvas id="world"></canvas>
<div id="hud">
  <div class="top">
    <span class="logo">🎣 피쉬레스트</span>
    <span class="pill" id="coins">🪙 0</span>

    <button id="bDex">📖 도감 <kbd>B</kbd></button><button id="bTank">🐠 내 어항 <kbd>F</kbd></button><button id="bShop">🛒 상점 <kbd>E</kbd></button>
    <button id="bBag">🎒 가방</button><button id="bSet">⚙ 설정</button><button id="bSave">💾 저장</button><button id="bSound">🔊 사운드</button><button id="bSit">🪑 앉기</button>
  </div>
  <div id="equip" class="pill small"></div>
  <div id="prompt"></div>
  <button id="fishBtn">🎣 낚시 시작</button>
  <div id="chat"><div id="log"></div><div class="row"><input id="msg" placeholder="채팅 입력 후 Enter"><span id="emo"></span></div></div>
  <div id="joy"><i></i></div>
  <div id="toast"></div>
  <div id="dc"></div>
</div>
<div id="start" class="modal show"><div class="stB" data-step="1">
 <div class="card st1"><h1>🎣 피쉬레스트 <small class="enLogo">FISHREST</small></h1><p class="muted small">고즈넉한 호수에서 함께 낚시하는 힐링 메타버스</p>
  <div class="stSteps"><span data-s="1">1 닉네임</span><span data-s="2">2 서버</span><span data-s="3">3 캐릭터</span></div>
  <div class="stA"><div class="lbl">닉네임</div><input id="stNick" maxlength="10" placeholder="최대 10자" autocomplete="off"><small id="stNickOk" class="muted"></small><button class="big stNext" data-to="2">다음</button></div>
  <div class="stS"><div class="lbl">서버</div><div id="stSrv"></div><div class="note">로그인 없이 이 브라우저에 저장돼요. 다음에 오면 고른 닉네임·서버·캐릭터가 그대로 남아 있어요.</div><div class="stNav"><button class="stNext ghost" data-to="1">이전</button><button class="big stNext" data-to="3">다음</button></div></div></div>
 <div class="card st2"><div class="stPrev"><img id="stImg" alt=""></div><b id="stName"></b><small id="stDesc" class="muted"></small>
  <button id="go" class="big">탭해서 시작 (사운드 ON)</button><p id="loading" class="muted small">에셋 로딩 중…</p>
  <p class="muted small stKeys">WASD 이동 · 드래그 회전 · 휠 줌 · Space 낚시 · F 어항 · E 상점/구경 · B 도감</p><button class="stNext ghost stBack" data-to="2">이전</button></div>
 <div class="card st3"><div class="lbl">캐릭터 선택</div><div id="charPick"></div></div>
