<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>피쉬코지 · 카카오 로그인</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1f3b4d;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:16px}a{color:#ffe36e}</style>
</head><body><p id="m">카카오 로그인 확인 중…</p>
<script>
// v165: 카카오 로그인에서 돌아온 창 — 게임 창에 결과를 넘기고 닫아요. 게임 창이 없으면(같은 창 이동) 게임으로 돌아가요
(function(){var q=new URLSearchParams(location.search),p={code:q.get('code')||'',state:q.get('state')||'',err:q.get('error')||'',t:Date.now()};
try{localStorage.setItem('nk_kakao',JSON.stringify(p));}catch(e){}
var op=null;try{op=window.opener&&!window.opener.closed?window.opener:null;}catch(e){}
var w=null;try{w=JSON.parse(localStorage.getItem('nk_kk_wait')||'null');}catch(e){}
var pop=w&&w.st===p.state&&w.mode==='pop'&&Date.now()-w.t<15*60e3;
if(op||pop){try{op&&op.postMessage({nkKakao:p},location.origin);}catch(e){}setTimeout(function(){window.close();},150);
 setTimeout(function(){document.getElementById('m').innerHTML='✅ 확인했어요. 이 창을 닫고 게임으로 돌아가세요';},900);return;}
location.replace('./?kk='+encodeURIComponent(p.code)+'&kst='+encodeURIComponent(p.state)+(p.err?'&kerr='+encodeURIComponent(p.err):''));})();
</script></body></html>
