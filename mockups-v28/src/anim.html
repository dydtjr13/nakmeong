<!doctype html><body style="margin:0"><canvas id=c width=1400 height=420></canvas><script src="../../lib/three.min.js"></script><script>
// 동물 둥글게 시안: R0 현행 / R1 구 세분화+부드러운 음영 / R2 R1+모서리 둥근 상자 / R3 R2+툰 음영
const Q=new URLSearchParams(location.search),OPT=Q.get('o')||'R0';
fetch('../../chars-v18.js').then(r=>r.text()).then(src=>{
 if(OPT!=='R0'){src=src.replace('flatShading:true','flatShading:false').replace('new THREE.IcosahedronGeometry(r,det)','new THREE.IcosahedronGeometry(r,Math.max(det,3))').replace('new THREE.CylinderGeometry(r1,r2,h,s)','new THREE.CylinderGeometry(r1,r2,h,Math.max(s,20))').replace('new THREE.ConeGeometry(r,h,s)','new THREE.ConeGeometry(r,h,Math.max(s,s>4?20:s))');}
 if(OPT==='R2'||OPT==='R3')src=src.replace('const box=(w,h,d,c,p,x,y,z)=>mesh(new THREE.BoxGeometry(w,h,d),c,p,x,y,z);','const RB=(w,h,d)=>{const r=Math.min(w,h,d)*.4,g=new THREE.BoxGeometry(w,h,d,4,4,4),a=g.attributes.position,v=new THREE.Vector3(),c=new THREE.Vector3(),I=new THREE.Vector3(w/2-r,h/2-r,d/2-r);for(let i=0;i<a.count;i++){v.fromBufferAttribute(a,i);c.copy(v).clamp(I.clone().negate(),I);v.sub(c);if(v.lengthSq()>0)v.normalize().multiplyScalar(r);v.add(c);a.setXYZ(i,v.x,v.y,v.z);}g.computeVertexNormals();return g;};const box=(w,h,d,c,p,x,y,z)=>mesh(RB(w,h,d),c,p,x,y,z);');
 if(OPT==='R3')src=src.replace('const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(c).convertSRGBToLinear(),roughness:.85,metalness:0,flatShading:false},o));','const GM=(()=>{const t=new THREE.DataTexture(new Uint8Array([90,90,90,255,170,170,170,255,255,255,255,255]),3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();const M=(c,o={})=>new THREE.MeshToonMaterial(Object.assign({color:new THREE.Color(c).convertSRGBToLinear(),gradientMap:GM},o));');
 (0,eval)(src);
 const T=THREE,r=new T.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});r.outputEncoding=T.sRGBEncoding;const s=new T.Scene();s.background=new T.Color('#eef4ea');
 const cam=new T.PerspectiveCamera(15,1400/420,.1,100);cam.position.set(0,2.4,12);cam.lookAt(0,1,0);s.add(new T.HemisphereLight('#ffffff','#a0b090',.9));const d=new T.DirectionalLight('#fff',1.0);d.position.set(3,6,5);s.add(d);
 const ks=(Q.get('k')||'duck,penguin,otter,rabbit').split(','),info={};
 ks.forEach((k,i)=>{const g=NK_CHARS.buildAnimal(k);g.position.x=(i-(ks.length-1)/2)*2.6;g.rotation.y=-.45;s.add(g);let t=0;g.traverse(m=>{if(m.isMesh){const G=m.geometry;t+=G.index?G.index.count/3:G.attributes.position.count/3;}});info[k]=Math.round(t);});
 r.render(s,cam);const t0=performance.now();for(let i=0;i<30;i++)r.render(s,cam);window.INFO={tri:info,ms:(performance.now()-t0)/30,calls:r.info.render.calls};document.title='ok';});
</script>
