<div class="tagline"><span id="cap"></span></div>
<div class="wrap" id="root"></div>
<script>
const V=(new URLSearchParams(location.search).get('v')||'a').toLowerCase(),MOB=innerWidth<700;
const L=[['붕어왕','🧑‍🦱','132.5cm',0],['물멍러','👩','128.9cm',1],['밤낚시꾼','🧔','127.2cm',-1],['잉어사랑','👧','121.0cm',2],['찌맞춤','🧑','118.4cm',0],['초보강태공','👦','115.7cm',-2],['호수산책','👩‍🦰','112.3cm',1]];
const ME=['나','🙂','98.6cm',3,42];
const head=(title)=>`<div class="ph"><h2>${title}</h2><div class="tabs"><b class="on">🏠 낚멍-3 서버</b><b>🌏 전체 서버</b></div><div class="cats"><b class="on">📏 최대 크기</b><b>📖 도감</b><b>🪙 코인</b><b>📅 주간</b></div><div class="sub">붕어 최대 크기 기준 · 매일 00:00 갱신 · 서버 인원 87명</div></div>`;
const ch=c=>c>0?`<span class="ch up">▲${c}</span>`:c<0?`<span class="ch dn">▼${-c}</span>`:`<span class="ch" style="color:#bbb">–</span>`;
const rows=(from)=>L.slice(from).map((r,i)=>`<div class="row"><div class="n">${from+i+1}</div><div class="av">${r[1]}</div><div class="nm">${r[0]}</div>${ch(r[3])}<div class="v">${r[2]}</div></div>`).join('')+`<div class="row me"><div class="n">${ME[4]}</div><div class="av">${ME[1]}</div><div class="nm">${ME[0]} <small style="color:#e0703a">(나)</small></div>${ch(ME[3])}<div class="v">${ME[2]}</div></div>`;
const TT=['👑 호수의 왕','🥈 은빛 낚시꾼','🥉 청동 강태공'];
let P='',cap='';
if(V==='a'){cap='시안 A · 포디움 시상대 — 1~3위를 금·은·동 단상 + 왕관 + 빛나는 테두리로';
 const pc=(i,c)=>`<div class="pc p${i+1}"><div class="ava"><span class="cr crown">${['👑','🥈','🥉'][i]}</span>${L[i][1]}</div><div class="nm">${L[i][0]}</div><div class="v">${L[i][2]}</div><div><span class="title t${i+1}">${TT[i]}</span></div><div class="blk">${i+1}</div></div>`;
 P=`<div class="panel A">${head('🏆 랭킹')}<div class="pod">${pc(1)}${pc(0)}${pc(2)}</div>${rows(3)}</div>`;}
if(V==='b'){cap='시안 B · 트로피 카드 — 상위 3명은 금속 질감 카드 + 반짝임, 보상 칭호 표시';
 P=`<div class="panel B">${head('🏆 랭킹')}<div class="top">${[0,1,2].map(i=>`<div class="tc g${i+1}"><div class="rk">${i+1}</div><div class="tr">${['🏆','🥈','🥉'][i]}</div><div><div class="nm">${L[i][0]} <span class="title t${i+1}">${TT[i]}</span></div><span class="rw">보상: ${['칭호 + 황금 왕관 + 상자 ×5','칭호 + 은빛 테두리 + 상자 ×3','칭호 + 청동 테두리 + 상자 ×2'][i]}</span></div><div class="v">${L[i][2]}<small>${['🔥 3일 연속 1위','',''][i]}</small></div></div>`).join('')}</div>${rows(3)}</div>`;}
if(V==='c'){cap='시안 C · 명예의 전당 사이드 패널 — 게임 화면 위에 반투명, 회전하는 오라 링';
 P=`<div class="panel C">${head('🌟 명예의 전당')}<div class="hof">${[0,1,2].map(i=>`<div class="h h${i+1}"><div class="ring"><span>${L[i][1]}</span></div><div><div class="nm">${['👑 ','🥈 ','🥉 '][i]}${L[i][0]}</div><span class="title t${i+1}">${TT[i]}</span></div><div class="v">${L[i][2]}</div></div>`).join('')}</div>${rows(3).replace(/<div class="row/g,'<div class="row')}</div>`;}
if(V==='d'){cap='시안 D · 주간 시즌 리그 — 남은 시간·리그 단계·1~3위 보상을 먼저 보여 욕심을 자극';
 P=`<div class="panel D">${head('📅 주간 리그')}<div class="season"><div style="font-size:30px">🏅</div><div><b>시즌 12 · 골드 리그</b><div style="font-size:12px;opacity:.85">상위 3명은 다음 주 칭호·왕관 유지</div></div><div class="tm">남은 시간<b>2일 14:32</b></div></div>
 <div class="lg"><span>브론즈</span><span>실버</span><span class="on">골드</span><span>다이아</span><span>전설</span></div>
 <div class="rwd"><div class="r1"><b>👑</b>1위<br>호수의 왕 칭호<br>황금 오라</div><div class="r2"><b>🥈</b>2위<br>은빛 낚시꾼<br>은빛 테두리</div><div class="r3"><b>🥉</b>3위<br>청동 강태공<br>청동 테두리</div></div>
 ${L.map((r,i)=>`<div class="row ${i<3?'top'+(i+1):''}"><div class="n ${i<3?'m'+(i+1):''}">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="av">${r[1]}</div><div class="nm">${r[0]}${i<3?`<span class="title t${i+1}">${TT[i]}</span>`:''}</div>${ch(r[3])}<div class="v">${r[2]}</div></div>`).join('')}<div class="row me"><div class="n">${ME[4]}</div><div class="av">${ME[1]}</div><div class="nm">나 <small style="color:#e0703a">· 3위까지 12.6cm!</small></div>${ch(ME[3])}<div class="v">${ME[2]}</div></div></div>`;}
// 인게임 표시 (공통): 원본 스크린샷 좌표(1280x720 / 390x844)를 비율로 배치
const H=MOB?{w:390,h:844,p:[[195,339],[302,318],[78,325]],crop:[0,844*.3-0]}:{w:1280,h:720,p:[[640,276],[828,268],[434,258]]};
const ord=[{i:0,k:1,name:L[0][0]},{i:1,k:2,name:L[1][0]},{i:2,k:3,name:L[2][0]}];
let IG=`<div class="ig" id="ig"><div class="cap">인게임 표시 예시 · 서버 1~3위 닉네임 위 왕관·칭호·오라</div>`;
ord.forEach(o=>{IG+=`<div class="aura k${o.k}" data-p="${o.i}" data-dy="62"></div><div class="np k${o.k}" data-p="${o.i}" data-dy="${MOB?30:0}"><span class="cw">${['👑','🥈','🥉'][o.k-1]}</span><span class="t t${o.k}">${TT[o.k-1]}</span><br><span class="nn">${o.k===1?'✨':''}${o.name}</span></div>`;});
IG+=`<div class="toastx">👑 <b>붕어왕</b>님이 낚멍-3 서버 크기 랭킹 1위에 올랐어요!</div></div>`;
document.getElementById('cap').textContent=cap;document.getElementById('root').innerHTML=P+IG;
function place(){const ig=document.getElementById('ig'),r=ig.getBoundingClientRect();
 // background-size:cover 매핑
 const s=Math.max(r.width/H.w,r.height/H.h),ox=(r.width-H.w*s)/2,oy=MOB?(r.height-H.h*s)*.3:(r.height-H.h*s)/2;
 ig.querySelectorAll('[data-p]').forEach(e=>{const [x,y]=H.p[+e.dataset.p];e.style.left=(ox+x*s)+'px';e.style.top=(oy+y*s+(+e.dataset.dy)*s)+'px';});}
place();addEventListener('resize',place);
window.READY=()=>document.fonts?document.fonts.status==='loaded':true;
</script></body></html>
