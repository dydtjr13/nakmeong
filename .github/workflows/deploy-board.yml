# 게시판 API 워커(fishcozy-board-api) 자동 배포 — main 에 workers/board-api 변경이 머지되면 배포
# 필요: GitHub 저장소 Secret `CLOUDFLARE_API_TOKEN`
name: Deploy board API

on:
  push:
    branches: [main]
    paths:
      - "workers/board-api/**"
      - ".github/workflows/deploy-board.yml"
  workflow_dispatch:

concurrency:
  group: deploy-board
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/board-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 문법 확인
        run: node --check src/index.js
      - name: Cloudflare 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: node scripts/deploy.mjs
      - name: 헬스·CORS 확인
        run: |
          sleep 5
          curl -fsS https://fishcozy-board-api.mi1ku.workers.dev/health
          curl -fsS -D - -o /dev/null -H "Origin: http://fishcozy.com" "https://fishcozy-board-api.mi1ku.workers.dev/posts?limit=1" | grep -i "access-control-allow-origin: http://fishcozy.com"
