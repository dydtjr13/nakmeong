# 일회성: 닉네임으로 저장 코드 찾기 (결과는 코드·경험치·시각만 로그에 출력)
name: ops find save
on:
  push:
    branches: [ops/find-save]
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 찾기
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          sleep 60
          cat > f.mjs <<'JS'
          const secret = process.env.ADMIN_PASSWORD;
          const exp = Date.now() + 600e3;
          const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
          const sig = [...new Uint8Array(await crypto.subtle.sign("HMAC", key, new TextEncoder().encode("board:" + exp)))].map((b) => b.toString(16).padStart(2, "0")).join("");
          for (const nick of ["뉴깐깐"]) {
            const r = await fetch("https://fishcozy-board-api.mi1ku.workers.dev/saves/find?nick=" + encodeURIComponent(nick), { headers: { "X-Admin-Token": exp + "." + sig, Origin: "https://fishcozy.com" } });
            const j = await r.json();
            console.log("STATUS", r.status, j.ok, j.error || "");
            for (const x of j.list || []) console.log("ROW", x.code, "xp=" + x.xp, "coins=" + x.coins, "caught=" + x.caught, "updated=" + new Date(x.updated_at).toISOString(), "created=" + new Date(x.created_at).toISOString());
          }
          JS
          node f.mjs
