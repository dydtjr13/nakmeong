# 일회성: 닉네임으로 저장 코드 찾기 (결과는 코드·레벨·시각만 로그에 출력)
name: ops find save
on:
  push:
    branches: [ops/find-save]
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: D1 조회
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          Q='{"sql":"SELECT code, updated_at, created_at, size, json_extract(data, ''$.nick'') AS nick, json_extract(data, ''$.xp'') AS xp, json_extract(data, ''$.coins'') AS coins FROM saves WHERE data LIKE ? ORDER BY updated_at DESC LIMIT 20","params":["%뉴깐깐%"]}'
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/0dd46e415e6622db15aec7a31865b350/d1/database/a0e990c1-470b-46a1-8525-3a8a68804f17/query" \
            -H "Authorization: Bearer $CF" -H "Content-Type: application/json" --data "$Q" | python3 -c "import sys,json;d=json.load(sys.stdin);print('success',d.get('success'),d.get('errors'));[print('ROW',r) for x in (d.get('result') or []) for r in x.get('results',[])]"
          Q2='{"sql":"SELECT COUNT(*) AS n, MAX(updated_at) AS last FROM saves"}'
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/0dd46e415e6622db15aec7a31865b350/d1/database/a0e990c1-470b-46a1-8525-3a8a68804f17/query" \
            -H "Authorization: Bearer $CF" -H "Content-Type: application/json" --data "$Q2" | python3 -c "import sys,json;d=json.load(sys.stdin);print('total',[r for x in (d.get('result') or []) for r in x.get('results',[])])"
