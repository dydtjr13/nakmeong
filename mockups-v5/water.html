<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>v5 시안 · 물 퀄리티</title><script src="../lib/three.min.js"></script>
<style>body{margin:0;overflow:hidden;font-family:'Noto Sans KR',sans-serif}#hud{position:fixed;left:12px;top:10px;background:#fffe;border-radius:14px;padding:8px 12px;font-size:13px;color:#3d3548;max-width:520px;box-shadow:0 4px 14px #0002}#hud b{font-size:16px}</style></head><body><div id="hud"></div>
<script>
const Q=new URLSearchParams(location.search),V=+(Q.get('v')||2),TOD=Q.get('tod')||'day';
const T={day:{sky:'#bfe6f2',hemi:['#ffffff','#9ac6c0',1],sun:['#fff2dd',.8],deep:'#5fb8c8',shal:'#a8e4e0',spec:'#ffffff'},sunset:{sky:'#f7c4a8',hemi:['#ffd8c0','#8a7aa0',.85],sun:['#ffb070',.9],deep:'#7a8ab8',shal:'#f0b8a8',spec:'#ffd0a0'},night:{sky:'#2a3358',hemi:['#8a9ad8','#202840',.55],sun:['#b8c8ff',.35],deep:'#1f3a5a',shal:'#3a6a88',spec:'#dfe8ff'}}[TOD];
const NM=['','A · 현행 (Lambert 반투명 평면)','B · 프레넬 셰이더 + 정점 물결','C · 노멀맵 잔물결 (스크롤 2겹, 스펙큘러)','D · B + 간이 평면 반사 (1/4 해상도)'];
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(1);r.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(T.sky);s.fog=new THREE.Fog(T.sky,30,80);const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);cam.position.set(9,5.5,13);cam.lookAt(0,0,0);
s.add(new THREE.HemisphereLight(T.hemi[0],T.hemi[1],T.hemi[2]));const sun=new THREE.DirectionalLight(T.sun[0],T.sun[1]);sun.position.set(-8,10,-6);s.add(sun);
const M=(c,x)=>new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},x||{}));
// 호숫가 (파스텔 로우폴리)
const shore=new THREE.Mesh(new THREE.RingGeometry(12,40,24,1),M(TOD==='night'?'#4a6a5a':'#bfe3a0'));shore.rotation.x=-Math.PI/2;shore.position.y=.05;s.add(shore);
const bed=new THREE.Mesh(new THREE.CircleGeometry(12.5,24),M(TOD==='night'?'#2a4a50':'#e9d9a8'));bed.rotation.x=-Math.PI/2;bed.position.y=-1.2;s.add(bed);
for(let i=0;i<14;i++){const a=i/14*6.28,t=new THREE.Group();const tr=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,1.4,5),M('#a07a58'));tr.position.y=.7;const lf=new THREE.Mesh(new THREE.ConeGeometry(1,2.2,6),M(['#8fd18a','#a8dc8a','#f4b8c8'][i%3]));lf.position.y=2.3;t.add(tr,lf);t.position.set(Math.cos(a)*15,0,Math.sin(a)*15);s.add(t);}
for(let i=0;i<6;i++){const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*.4,0),M('#c8c0b8'));const a=i*1.1;rk.position.set(Math.cos(a)*11.8,0,Math.sin(a)*11.8);s.add(rk);}
const deck=new THREE.Mesh(new THREE.BoxGeometry(2.4,.18,7),M('#dcae80'));deck.position.set(2,.35,6);s.add(deck);[[-1,3],[1,3],[-1,8.5],[1,8.5]].forEach(([x,z])=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2,6),M('#b88a62'));p.position.set(2+x,-.6,z-.5);s.add(p);});
const lp=new THREE.Mesh(new THREE.SphereGeometry(.25,8,6),new THREE.MeshBasicMaterial({color:'#fff1c4'}));lp.position.set(3,2,3);s.add(lp);
for(let i=0;i<5;i++){const lily=new THREE.Mesh(new THREE.CircleGeometry(.45,7),M('#7ac07a',{side:2}));lily.rotation.x=-Math.PI/2;lily.position.set(-4+i*1.3,.04,-3+((i*7)%5));s.add(lily);}
// 물
const WG=V===1?new THREE.CircleGeometry(12.2,32):new THREE.CircleGeometry(12.2,48,0,Math.PI*2);let wm,uni={t:{value:0}};
function normTex(){const n=128,cv=document.createElement('canvas');cv.width=cv.height=n;const x=cv.getContext('2d'),im=x.createImageData(n,n);const h=(i,j)=>Math.sin(i*.29+Math.cos(j*.17)*2)*.5+Math.sin(j*.23+i*.11)*.5+Math.sin((i+j)*.41)*.3;
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){const dx=h(i+1,j)-h(i-1,j),dy=h(i,j+1)-h(i,j-1),k=(j*n+i)*4;im.data[k]=128+dx*60;im.data[k+1]=128+dy*60;im.data[k+2]=255;im.data[k+3]=255;}x.putImageData(im,0,0);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(10,10);return t;}
let rt=null,mcam=null;
if(V===1){wm=new THREE.MeshLambertMaterial({color:T.deep,transparent:true,opacity:.72});}
else if(V===3){const nt=normTex();wm=new THREE.MeshPhongMaterial({color:T.deep,specular:T.spec,shininess:90,normalMap:nt,normalScale:new THREE.Vector2(.6,.6),transparent:true,opacity:.82});wm.userData.nt=nt;}
else{if(V===4){rt=new THREE.WebGLRenderTarget(innerWidth/4|0,innerHeight/4|0);mcam=cam.clone();}
 uni=Object.assign(uni,{deep:{value:new THREE.Color(T.deep)},shal:{value:new THREE.Color(T.shal)},sky:{value:new THREE.Color(T.sky)},spec:{value:new THREE.Color(T.spec)},sunD:{value:sun.position.clone().normalize()},refl:{value:rt?rt.texture:null},useR:{value:V===4?1:0},res:{value:new THREE.Vector2(innerWidth,innerHeight)}});
 wm=new THREE.ShaderMaterial({uniforms:uni,transparent:true,vertexShader:`uniform float t;varying vec3 vW;varying vec3 vN;varying vec4 vC;void main(){vec3 p=position;float w=sin(p.x*.8+t*1.2)*.04+sin(p.y*1.1+t*.9)*.035;p.z+=w;vec4 wp=modelMatrix*vec4(p,1.);vW=wp.xyz;vN=normalize(vec3(-cos(p.x*.8+t*1.2)*.032,1.,-cos(p.y*1.1+t*.9)*.0385));vC=projectionMatrix*viewMatrix*wp;gl_Position=vC;}`,
 fragmentShader:`uniform vec3 deep,shal,sky,spec,sunD;uniform sampler2D refl;uniform float useR,t;varying vec3 vW;varying vec3 vN;varying vec4 vC;void main(){vec3 V=normalize(cameraPosition-vW);float f=pow(1.-max(dot(V,vN),0.),3.);float d=clamp(length(vW.xz)/12.,0.,1.);vec3 base=mix(deep,shal,smoothstep(.75,1.,d));vec3 c=mix(base,sky,f*.8);
 if(useR>.5){vec2 uv=vC.xy/vC.w*.5+.5;uv.x=uv.x;uv.y=1.-uv.y;uv+=vN.xz*.03;vec3 rc=texture2D(refl,uv).rgb;c=mix(c,rc,.35+f*.4);}
 vec3 H=normalize(sunD+V);float sp=pow(max(dot(vN,H),0.),120.);c+=spec*sp*.9;float edge=smoothstep(.93,1.,d)*(.5+.5*sin(t*2.+vW.x*3.));c=mix(c,vec3(1.),edge*.35);gl_FragColor=vec4(c,.86);
 #include <encodings_fragment>
 }`});}
const water=new THREE.Mesh(WG,wm);water.rotation.x=-Math.PI/2;s.add(water);
let fr=0,t0=performance.now(),ms=0,info='';
function loop(){const t=performance.now()/1000;uni.t.value=t;if(wm.userData.nt){wm.userData.nt.offset.set(t*.02,t*.013);}
 r.info.reset();r.info.autoReset=false;
 if(rt){water.visible=false;mcam.position.set(cam.position.x,-cam.position.y,cam.position.z);mcam.up.set(0,-1,0);mcam.lookAt(0,0,0);mcam.projectionMatrix.copy(cam.projectionMatrix);r.setRenderTarget(rt);r.render(s,mcam);r.setRenderTarget(null);water.visible=true;}
 const a=performance.now();r.render(s,cam);ms+=performance.now()-a;fr++;
 if(fr===40){const I=r.info.render;info=`draw calls <b>${I.calls}</b> · 삼각형 ${(I.triangles/1000).toFixed(1)}k · 렌더 ${(ms/fr).toFixed(1)}ms/프레임(헤드리스 SW 기준)`;document.getElementById('hud').innerHTML=`<b>💧 ${NM[V]}</b> · ${({day:'낮',sunset:'노을',night:'밤'})[TOD]}<br>${info}<br><small>${['','기준선. 셰이더 비용 0','물 1장 셰이더만 교체 → draw call 증가 0, 정점 48세그','텍스처 1장(128²) 추가 · Phong 1패스','반사용 씬 1회 추가 렌더(1/4 해상도) → draw call ≈2배, 가장 비쌈'][V]}</small>`;window.STAT={v:V,tod:TOD,calls:I.calls,tri:I.triangles,ms:ms/fr};}
 requestAnimationFrame(loop);}loop();
</script></body></html>
