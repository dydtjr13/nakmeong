<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>v5 시안 · 낚싯대 강화 연출</title>
<style>body{margin:0;width:960px;height:600px;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:#2a2238;color:#fff}
.st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:none}
.cap{position:absolute;left:16px;top:12px;background:#fff;color:#3d3548;border-radius:12px;padding:6px 12px;font-size:13px;z-index:9}.cap b{font-size:15px}
.lvl{position:absolute;top:60px;width:100%;text-align:center;font-size:34px;font-weight:900;letter-spacing:2px;text-shadow:0 4px 0 #0005}.lvl small{font-size:16px;opacity:.8;display:block;font-weight:500}
.rod{width:300px;height:300px;object-fit:contain;filter:drop-shadow(0 0 20px var(--g,#fff3))}
.ring{position:absolute;width:360px;height:360px;border-radius:50%;background:conic-gradient(var(--rc,#f4a62a) calc(var(--p)*1%),#ffffff18 0);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63% 70%,transparent 71%);mask:radial-gradient(circle,transparent 62%,#000 63% 70%,transparent 71%)}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd76a;box-shadow:0 0 8px #ffb000}
.rate{position:absolute;bottom:70px;font-size:18px;background:#0006;padding:6px 16px;border-radius:12px}.rate b{color:#ffd76a}
.vign{position:absolute;inset:0;background:radial-gradient(circle,transparent 30%,#000c 80%)}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff 0,#fff8 30%,transparent 70%)}
.burst{position:absolute;width:700px;height:700px;background:repeating-conic-gradient(from 0deg,#ffd76a55 0 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
.big{position:absolute;font-size:96px;font-weight:900;color:#ffd76a;text-shadow:0 0 30px #ffb000,0 6px 0 #a06000}
.fail{filter:grayscale(1) brightness(.6)}.smoke{position:absolute;width:260px;height:160px;border-radius:50%;background:radial-gradient(#8888 0,transparent 70%);top:300px}
.gauge{position:absolute;bottom:110px;width:620px;height:34px;border-radius:17px;background:#ffffff22;overflow:hidden;border:3px solid #fff8}.gauge .z{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#5fc48a,#b8f0a0)}.gauge .zz{position:absolute;top:0;bottom:0;background:#ffd76a}.gauge .n{position:absolute;top:-6px;bottom:-6px;width:6px;background:#fff;box-shadow:0 0 10px #fff;border-radius:3px}
.key{position:absolute;bottom:60px;font-size:15px;opacity:.85}
.slow{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff1 0 2px,transparent 2px 40px)}
.rune{position:absolute;width:90px;height:90px;border-radius:50%;border:4px solid #ffffff44;display:flex;align-items:center;justify-content:center;font-size:40px;color:#ffffff44}.rune.on{border-color:#c98cff;color:#fff;box-shadow:0 0 30px #c98cff,inset 0 0 20px #c98cff}
.card{position:absolute;width:220px;height:300px;border-radius:20px;background:linear-gradient(160deg,#4a3a7a,#2a2048);border:4px solid #c98cff;display:flex;align-items:center;justify-content:center;font-size:20px}.card.flip{transform:perspective(600px) rotateY(70deg)}
.shake{animation:none;transform:translate(6px,-4px) rotate(-1deg)}
</style></head><body><div id="r"></div>
<script>
const Q=new URLSearchParams(location.search),S=+(Q.get('s')||1),F=+(Q.get('f')||0),HI=Q.get('hi')==='1';
const rod=`<img class="rod" src="../mockups-v4/img/rod-dragon.png">`;let h='',cap='';
const sparks=(n,rad)=>Array.from({length:n},(_,i)=>{const a=i*137.5*Math.PI/180,r=rad*(.6+((i*37)%40)/100);return `<i class="sp" style="left:${480+Math.cos(a)*r}px;top:${300+Math.sin(a)*r}px"></i>`;}).join('');
if(S===1){const L=['① 대기: 강화석 투입','② 차징 40% (꾹 누르기)','③ 차징 100% · 불꽃 집중','④ 슬로모션 · 화면 비네트+균열','⑤-성공 +8 버스트','⑤-실패 연기·1단계 하락'];cap=`<b>시퀀스 1 · 용광로 차징</b> — ${L[F]}`;
 const p=[0,40,100,100,100,100][F];h=`<div class="lvl">+7 → +8<small>성공률 ${HI?'20':'45'}% · ${HI?'실패 시 하락 50%':''}</small></div>`;
 if(F>=3&&F<5)h+=`<div class="vign"></div><div class="slow"></div>`;if(F===4)h+=`<div class="burst"></div><div class="flash"></div>`;
 h+=`<div class="ring" style="--p:${p};--rc:${F>=2?'#ffd76a':'#f4a62a'}"></div>`+(F===5?`<div class="fail">${rod}</div><div class="smoke"></div>`:`<div style="--g:${F>=2?'#ffb000':'#fff3'}">${rod}</div>`)+(F>=1&&F<4?sparks(F*14,F>=2?120:190):'')+(F===4?sparks(40,260)+'<div class="big">+8!</div>':'')+(F===5?'<div class="big" style="color:#bbb;text-shadow:none">+6 ▼</div>':'')+`<div class="rate">${F<3?'🔥 차징이 클수록 연출만 강해짐 (확률 불변)':F===3?'… 두근 …':''}</div>`;}
if(S===2){const L=['① 게이지 등장 (성공 구간 초록, 대박 구간 금색)','② 바늘 왕복 중','③ 탭! 순간 정지','④ 슬로모션 줌 (바늘이 구간 경계)','⑤-대성공 (금색 구간: 연출 강화)','⑤-실패 (빗나감)'];cap=`<b>시퀀스 2 · 타이밍 게이지 (연출용, 확률은 서버 판정)</b> — ${L[F]}`;
 const n=[50,20,58,61,64,90][F],zw=HI?14:30;h=`<div class="lvl">+9 → +10<small>최고 단계 · 성공률 10%</small></div>`+(F===3?'<div class="vign"></div><div class="slow"></div>':'')+(F===4?'<div class="burst"></div><div class="flash"></div><div class="big">+10 MAX</div>':'')+(F===5?`<div class="fail">${rod}</div>`:rod)+
 `<div class="gauge" style="${F===3?'transform:scale(1.25)':''}"><div class="z" style="left:${50-zw/2}%;width:${zw}%"></div><div class="zz" style="left:${62}%;width:4%"></div><div class="n" style="left:${n}%"></div></div><div class="key">${F<2?'SPACE / 탭으로 멈추기':''}</div>`;}
if(S===3){const L=['① 고단계(+8↑) 전용: 화면 암전','② 룬 1/3 점등','③ 룬 3/3 점등 · 카메라 흔들림','④ 카드 뒤집기 (슬로)','⑤-성공 전설 오라','⑤-실패 금이 간 카드'];cap=`<b>시퀀스 3 · 봉인 해제 (고레벨 전용 강화 연출)</b> — ${L[F]}`;
 h=`<div class="vign" style="background:#000${F===0?'8':'c'}"></div><div class="lvl">+8 → +9<small>봉인 해제</small></div>`;const on=[0,1,3,3,3,3][F];
 h+=[[-220,0],[0,-170],[220,0]].map(([x,y],i)=>`<div class="rune ${i<on?'on':''}" style="left:${435+x}px;top:${255+y}px">${'ᚠᚱᛟ'[i]}</div>`).join('');
 h+=F<3?`<div class="card ${F===2?'shake':''}">?</div>`:F===3?'<div class="card flip"></div>':F===4?`<div class="burst" style="background:repeating-conic-gradient(#c98cff55 0 6deg,transparent 6deg 18deg)"></div><div class="card" style="border-color:#ffd76a;box-shadow:0 0 60px #c98cff">${rod.replace('class="rod"','class="rod" style="width:200px"')}</div><div class="big" style="top:420px;font-size:60px">+9</div>`:`<div class="card fail" style="background:linear-gradient(160deg,#555,#222)">💔<br>균열</div><div class="big" style="top:420px;font-size:50px;color:#bbb;text-shadow:none">+8 유지</div>`;}
document.getElementById('r').innerHTML=`<div class="cap">${cap}</div><div class="st">${h}</div>`;window.READY=()=>true;
</script></body></html>
