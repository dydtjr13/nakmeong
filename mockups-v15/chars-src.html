const W=1800,H=640;const R=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});R.setSize(W,H);R.setClearColor(0xf6efe4);R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;
const S=new THREE.Scene();const cam=new THREE.PerspectiveCamera(26,W/H,.1,100);cam.position.set(0,2.6,15);cam.lookAt(0,1.45,0);
S.add(new THREE.HemisphereLight(0xffffff,0xc9b89c,.9));const L=new THREE.DirectionalLight(0xffffff,.9);L.position.set(5,9,7);L.castShadow=true;L.shadow.mapSize.set(2048,2048);Object.assign(L.shadow.camera,{left:-14,right:14,top:6,bottom:-3});S.add(L);

function recolor(o,map){if(!map)return;o.traverse(m=>{if(!m.isMesh||m.name!=='body-mesh')return;const mt=m.material.clone();const img=mt.map.image;const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const x=cv.getContext('2d');x.drawImage(img,0,0);
 const cw=img.width/16,ch=img.height/8;for(const k in map){const [cx,cy]=k.split(',').map(Number);const d=x.getImageData(cx*cw,cy*ch,cw,ch);const t=new THREE.Color(map[k]);let av=0;for(let i=0;i<d.data.length;i+=4)av+=d.data[i]+d.data[i+1]+d.data[i+2];av/=d.data.length/4;
  for(let i=0;i<d.data.length;i+=4){const l=(d.data[i]+d.data[i+1]+d.data[i+2])/av;d.data[i]=Math.min(255,t.r*255*l);d.data[i+1]=Math.min(255,t.g*255*l);d.data[i+2]=Math.min(255,t.b*255*l);}x.putImageData(d,cx*cw,cy*ch);}
 const tx=new THREE.CanvasTexture(cv);tx.flipY=mt.map.flipY;tx.encoding=mt.map.encoding;tx.magFilter=mt.map.magFilter;tx.minFilter=mt.map.minFilter;mt.map=tx;m.material=mt;});}
const MAT=c=>new THREE.MeshStandardMaterial({color:new THREE.Color(c).convertSRGBToLinear(),roughness:.85,metalness:0,flatShading:true});
function hat(o,kind,col){const h=o.getObjectByName('head');const hm=o.getObjectByName('head-mesh');const bb=new THREE.Box3().setFromObject(hm);const sz=bb.getSize(new THREE.Vector3()),top=bb.max.y;
 const g=new THREE.Group();const wp=h.getWorldPosition(new THREE.Vector3());const s=1/o.scale.x;const r=sz.x*.5*s;const y=(top-wp.y)*s-r*.12;
 if(kind==='straw'){const b=new THREE.Mesh(new THREE.CylinderGeometry(r*1.55,r*1.6,r*.08,10),MAT(col));b.position.y=y-r*.32;g.add(b);const t=new THREE.Mesh(new THREE.CylinderGeometry(r*.86,r*.98,r*.48,10),MAT(col));t.position.y=y-r*.08;g.add(t);const bd=new THREE.Mesh(new THREE.CylinderGeometry(r*1,r*1,r*.12,10),MAT(0xd0503a));bd.position.y=y-r*.24;g.add(bd);}
 if(kind==='beanie'){const t=new THREE.Mesh(new THREE.CylinderGeometry(r*.92,r*1.04,r*.62,8),MAT(col));t.position.y=y-r*.12;g.add(t);const rb=new THREE.Mesh(new THREE.CylinderGeometry(r*1.07,r*1.07,r*.2,8),MAT(new THREE.Color(col).multiplyScalar(.8)));rb.position.y=y-r*.38;g.add(rb);const p=new THREE.Mesh(new THREE.IcosahedronGeometry(r*.2,0),MAT(0xfffaf0));p.position.y=y+r*.28;g.add(p);}
 if(kind==='cap'){const t=new THREE.Mesh(new THREE.CylinderGeometry(r*.95,r*1.05,r*.4,8),MAT(col));t.position.y=y-r*.12;g.add(t);const v=new THREE.Mesh(new THREE.BoxGeometry(r*1.3,r*.07,r*.8),MAT(col));v.position.set(0,y-r*.3,r*1.05);g.add(v);}
 g.traverse(m=>{if(m.isMesh)m.castShadow=true;});h.add(g);}
(async()=>{const N=[
 ['character-male-a',null,null,'현행 · 성인 남성'],['character-female-a',null,null,'현행 · 성인 여성'],
 ['character-male-b',{'11,6':'#5fa8e0','11,7':'#3a78b8'},['straw',0xe8c26a],'신규 1 · 밀짚모자 낚시꾼'],
 ['character-female-b',null,['beanie',0x8a6fd0],'신규 2 · 비니 캠퍼'],
 ['character-male-e',{'9,6':'#7cc48a','9,7':'#4f9a62'},['cap',0xff7a45],'신규 3 · 캡모자 소년'],
 ['character-female-e',null,['straw',0xf2d9a0],'신규 4 · 여름 산책'],
 ['character-male-c',{'1,6':'#e8789a','1,7':'#c85a7a'},['beanie',0x5fa8e0],'신규 5 · 어린이 겨울룩']];
 const gl=await Promise.all(N.map(n=>get(n[0])));
 N.forEach((n,i)=>{const o=THREE.SkeletonUtils.clone(gl[i].scene);const s=n[0].endsWith('-c')?.72:1;o.scale.setScalar(2.6*s);o.position.x=(i-3)*2.35+(i<2?-.4:.3);o.rotation.y=-.18+(i-3)*-.04;o.traverse(m=>{if(m.isMesh)m.castShadow=true;});S.add(o);const mx=new THREE.AnimationMixer(o);const cl=gl[i].animations.find(a=>/idle/i.test(a.name))||gl[i].animations[0];if(cl){mx.clipAction(cl).play();mx.update(.6);}o.updateMatrixWorld(true);recolor(o,n[1]);if(n[2])hat(o,n[2][0],n[2][1]);});
 window.LABELS=N.map(n=>n[3]);S.updateMatrixWorld(true);R.render(S,cam);document.title='done';})();
