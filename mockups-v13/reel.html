<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>낚멍 v13 · 물고기 딸려 올라오는 모션 시안 (8)</title><link rel="stylesheet" href="common.css"><style>.stage{background-image:url(base-clean-d.jpg)}canvas{position:absolute;inset:0;width:100%;height:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(380px,1fr))}</style></head><body>
<header><h1>🐟 물고기가 딸려 올라오는 모션 시안 (8)</h1><div class="sub">챔질 성공 순간 → 성공 카드가 뜨기 전까지(약 1.2~1.8초) 재생되는 연출이에요. 모두 자동 반복 재생되고, 아래 정지 컷은 클릭하면 확대돼요. 실제 구현은 3D(찌 위치에서 물고기 모델이 튀어 오름)로 같은 궤적을 씁니다. <a href="index.html">← 시안 목록</a></div></header><main><div class="grid" id="G"></div></main>
<script>
const F={};['carp','catfish','bass','mandarin','eel','crucian'].forEach(k=>{const i=new Image();i.src='../img/fish/'+k+'.png';F[k]=i;});
const V=[
 ['A','포물선 점프','물기둥과 함께 튀어 올라 캐릭터 쪽으로 포물선을 그리며 날아와요. 가장 경쾌하고 짧음(1.2초).','carp',1],
 ['B','줄에 매달려 퍼덕','낚싯줄에 매달린 채 수면 위로 끌려 올라와 좌우로 퍼덕이며 물방울을 튀겨요. 손맛이 가장 잘 느껴짐.','bass'],
 ['C','수면 돌파 슬로우','수면을 뚫는 순간 0.4초 슬로우 + 화면 살짝 줌. 큰 물고기·높은 등급에 어울림.','catfish'],
 ['D','들어 올려 자랑','물고기가 캐릭터 머리 위로 날아와 번쩍 들어 올린 포즈로 멈춰요(성공 카드와 연결).','mandarin'],
 ['E','등급별 차등 연출','일반=작은 튐 → 희귀=물보라 링 → 전설/신화=물기둥 + 빛기둥 + 반짝이. 반복 재생 시 등급이 바뀌어요.','eel',1],
];
const G=document.getElementById('G');const cvs=[];
V.forEach(([k,n,d,f,r])=>{G.insertAdjacentHTML('beforeend',`<div class="card"><h3>${k} · ${n} ${r?'<span class="tag rec">추천</span>':''}</h3><div class="stage"><canvas width="1024" height="576"></canvas></div><p>${d}</p></div>`);cvs.push([G.lastElementChild.querySelector('canvas'),k,f]);});
const W=1024,H=576,WX=520,WY=215,PX=512,PY=300;// 수면(찌) 위치 · 캐릭터 머리
const ease=t=>1-Math.pow(1-t,3);let drops=new Map();
function splash(x,c,y,t,s=1){// 물보라 링 + 물방울
 for(let i=0;i<3;i++){const tt=t-i*.08;if(tt<0||tt>.7)continue;c.strokeStyle=`rgba(255,255,255,${.8*(1-tt/.7)})`;c.lineWidth=3*s;c.beginPath();c.ellipse(x,y,(20+tt*120)*s,(6+tt*36)*s,0,0,7);c.stroke();}
}
function dropsDraw(c,arr,dt){arr.forEach(p=>{p.vy+=900*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;});for(const p of arr)if(p.l>0){c.fillStyle=`rgba(255,255,255,${Math.min(1,p.l*2)})`;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();}}
function burst(arr,x,y,n,sp=1){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.6;const v=(200+Math.random()*300)*sp;arr.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*3.5,l:.6+Math.random()*.6});}}
function fish(c,img,x,y,rot,s,flip){if(!img.complete)return;c.save();c.translate(x,y);c.rotate(rot);c.scale(flip?-s:s,s);c.drawImage(img,-60,-30,120,60);c.restore();}
function line(c,x,y){c.strokeStyle='#ffffffcc';c.lineWidth=1.6;c.beginPath();c.moveTo(553,240);c.quadraticCurveTo((553+x)/2,Math.min(240,y)-30,x,y-18);c.stroke();}
let T0=performance.now(),last=T0;const st=cvs.map(()=>({drops:[],ph:-1,gr:0}));
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 cvs.forEach(([cv,k,f],i)=>{const c=cv.getContext('2d'),S=st[i];c.clearRect(0,0,W,H);const per=k==='C'?3.4:3;let t=((now-T0)/1000)%per;const cyc=Math.floor((now-T0)/1000/per);if(S.cyc!==cyc){S.cyc=cyc;S.b1=S.b2=0;S.gr=(S.gr+1)%4;}
  const img=F[f];
  if(k==='A'){if(t<.15){splash(WX,c,WY,t*3);}if(!S.b1){burst(S.drops,WX,WY,26);S.b1=1;}const u=Math.min(1,t/1.1);if(t<1.3){const x=WX+(PX-WX)*u,y=WY-Math.sin(u*Math.PI)*170+(PY-60-WY)*u;fish(c,img,x,y,-.6+u*1.4,.9+u*.3,0);}splash(WX,c,WY,t);
   if(t>1.15&&t<2){c.globalAlpha=1-(t-1.15)/.85;fish(c,img,PX,PY-60,0,1.2,0);c.globalAlpha=1;}}
  if(k==='B'){const u=ease(Math.min(1,t/1.2)),x=WX+(PX+60-WX)*u,y=WY+20-(u*150)+Math.sin(t*4)*4;line(c,x,y);if(!S.b1){burst(S.drops,WX,WY,18,.7);S.b1=1;}if(t>.3&&t<2.2&&Math.random()<.25)burst(S.drops,x,y+10,2,.4);fish(c,img,x,y+8,Math.PI/2+Math.sin(t*16)*.45*(1-u*.3),.95,0);splash(WX,c,WY,t);}
  if(k==='C'){const slow=t<.6?t*.35:(.21+(t-.6)*1.1),u=Math.min(1,slow/1);const z=t<.6?1+t*.12:Math.max(1,1.072-(t-.6)*.2);c.save();c.translate(WX,WY);c.scale(z,z);c.translate(-WX,-WY);if(!S.b1){burst(S.drops,WX,WY,40,.9);S.b1=1;}const y=WY+10-Math.sin(Math.min(1,u)*Math.PI*.8)*190;splash(WX,c,WY,slow*1.4,1.3);fish(c,img,WX+u*20,y,-1.1+u*1.6,1.25,0);if(t<.6){c.fillStyle='rgba(255,255,255,.12)';c.fillRect(0,0,W,H);}c.restore();
   if(t<.6){c.fillStyle='#fff';c.font='bold 28px sans-serif';c.textAlign='center';c.globalAlpha=.85;c.fillText('SLOW',WX,80);c.globalAlpha=1;}}
  if(k==='D'){const u=Math.min(1,t/.9);if(!S.b1){burst(S.drops,WX,WY,22);S.b1=1;}if(t<.9){const x=WX+(PX-WX)*u,y=WY-Math.sin(u*Math.PI)*120+(PY-95-WY)*u;fish(c,img,x,y,u*6.28,.9,0);}else{const b=Math.sin(Math.min(1,(t-.9)/.3)*Math.PI)*12;fish(c,img,PX,PY-95-b,0,1.15+b*.01,0);if(t>1){c.globalAlpha=Math.min(1,(t-1)*3);for(let j=0;j<8;j++){const a=j/8*6.28+t;c.fillStyle='#fff3b0';c.beginPath();c.arc(PX+Math.cos(a)*95,PY-95+Math.sin(a)*45,3.5,0,7);c.fill();}c.globalAlpha=1;}}splash(WX,c,WY,t);}
  if(k==='E'){const g=S.gr,nm=['일반','희귀','전설','신화'][g],col=['#ffffff','#7ab8ff','#ffd24d','#ff6fb0'][g],hgt=[80,140,200,230][g];if(!S.b1){burst(S.drops,WX,WY,[10,26,50,70][g],[.6,.9,1.2,1.4][g]);S.b1=1;}
   if(g>=2&&t<1.6){const a=Math.max(0,1-t/1.6);const gr=c.createLinearGradient(0,0,0,WY);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,col);c.globalAlpha=a*.7;c.fillStyle=gr;c.fillRect(WX-40-g*10,0,80+g*20,WY);c.globalAlpha=1;}
   if(g>=2&&t<.8){c.fillStyle='rgba(255,255,255,'+(.8-t)*.8+')';c.beginPath();c.ellipse(WX,WY-40*(t*2),26+g*6,90*(1-t),0,0,7);c.fill();}
   const u=Math.min(1,t/1.2);if(t<1.3){fish(c,img,WX+(PX-WX)*u,WY-Math.sin(u*Math.PI)*hgt+(PY-60-WY)*u,-.6+u*1.4,1,0);}splash(WX,c,WY,t,g>=1?1.3:.8);
   if(g>=1)for(let j=0;j<g*8;j++){const a=j*2.4+t*3,r=40+t*120;c.fillStyle=col;c.globalAlpha=Math.max(0,1-t/1.6);c.beginPath();c.arc(WX+Math.cos(a)*r,WY-30+Math.sin(a)*r*.5,3,0,7);c.fill();}c.globalAlpha=1;
   c.fillStyle='#0008';c.beginPath();c.roundRect(16,16,120,40,20);c.fill();c.fillStyle=col;c.font='bold 22px sans-serif';c.textAlign='center';c.fillText(nm,76,44);}
  dropsDraw(c,S.drops,dt);S.drops=S.drops.filter(p=>p.l>0);});
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);window.READY=1;
</script><script src="lb.js"></script></body></html>
