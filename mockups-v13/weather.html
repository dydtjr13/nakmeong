<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>낚멍 v13 · 날씨 시안 (25)</title><link rel="stylesheet" href="common.css"><style>.stage{background-image:url(base-clean-d.jpg)}canvas{position:absolute;inset:0;width:100%;height:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}.fx{font-size:12px;color:#8a7f96}</style></head><body>
<header><h1>🌦 날씨 변화 시안 (25) — 14종</h1><div class="sub">모든 날씨는 <b>화면 가장자리·하늘 위주</b>로 그리고 캐릭터·찌·버튼 주변은 옅게 처리해서 플레이에 지장이 없도록 했어요. 각 날씨에 가벼운 게임 효과(예: 비 → 입질 +5%)를 붙이면 날씨를 기다리는 재미가 생겨요. 실제 게임은 3D 파티클(GPU 1 draw call)로 구현하므로 프레임 영향은 미미해요. <a href="index.html">← 시안 목록</a></div></header><main><div class="grid" id="G"></div></main>
<script>
const V=[
 ['맑음 · 햇살','햇빛 줄기(갓레이)가 천천히 흔들려요.','효과 없음(기본)','sun'],
 ['구름 그늘','구름 그림자가 호수 위를 천천히 지나가요.','—','cloud'],
 ['이슬비','가늘고 옅은 비 + 수면 빗방울 동심원.','입질 대기 −5%','drizzle'],
 ['소나기 · 천둥','굵은 비 + 가끔 번개 섬광(약하게, 깜빡임 0.15초).','희귀어 확률 +10%','storm'],
 ['비 갠 뒤 무지개','하늘에 무지개 + 반짝이는 수면.','행운 +10% (5분)','rainbow'],
 ['아침 안개','호수 위에 낮게 깔리는 물안개. 먼 데크만 흐려져요.','대물 확률 +5%','fog'],
 ['함박눈','큼직한 눈송이가 천천히. 겨울 맵과 연동.','겨울 한정 어종 출현','snow'],
 ['벚꽃 바람','분홍 꽃잎이 바람 따라 흩날려요. 봄 맵과 연동.','판매가 +3%','petal'],
 ['낙엽','단풍잎이 빙글빙글 떨어져요. 가을 맵과 연동.','—','leaf'],
 ['바람 부는 날','수면에 바람결 줄무늬 + 풀 흔들림.','찌 흔들림 ↑ (가짜 입질 +)','wind'],
 ['노을','하늘·수면이 주황빛으로 물들어요.','—','sunset'],
 ['반딧불 밤','밤에 수면 근처를 떠다니는 반딧불.','야행성 어종 +10%','firefly'],
 ['별똥별 밤','가끔 별똥별이 떨어지고, 보면 소원 버프.','10초간 행운 +20%','meteor'],
 ['오로라 (희귀)','아주 드물게 하늘에 오로라. 서버 전체 공지.','상자 드롭 +30% (10분)','aurora'],
];
const G=document.getElementById('G'),cs=[];
V.forEach(([n,d,e,k],i)=>{G.insertAdjacentHTML('beforeend',`<div class="card"><h3>${i+1}. ${n}</h3><div class="stage"><canvas width="1024" height="576"></canvas></div><p>${d}</p><p class="fx">제안 게임 효과: ${e}</p></div>`);const cv=G.lastElementChild.querySelector('canvas');cs.push({cv,k,c:cv.getContext('2d'),P:[]});});
const W=1024,H=576,R=Math.random,SKY=95,SAFE=(x,y)=>{const dx=(x-512)/260,dy=(y-300)/200;return Math.min(1,.25+Math.sqrt(dx*dx+dy*dy)*.75);};
let t0=performance.now(),last=t0;
function frame(now){const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
 for(const s of cs){const c=s.c,P=s.P;c.clearRect(0,0,W,H);
  switch(s.k){
  case 'sun':{c.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const x=150+i*150+Math.sin(t*.4+i)*30;const g=c.createLinearGradient(x,0,x-220,H*.7);g.addColorStop(0,'rgba(255,240,190,.28)');g.addColorStop(1,'rgba(255,240,190,0)');c.fillStyle=g;c.beginPath();c.moveTo(x-20,0);c.lineTo(x+40,0);c.lineTo(x-200,H*.7);c.lineTo(x-300,H*.7);c.fill();}c.globalCompositeOperation='source-over';break;}
  case 'cloud':{for(let i=0;i<4;i++){const x=((t*25+i*330)%1500)-250,y=140+i*90;c.fillStyle='rgba(40,60,80,.16)';c.beginPath();c.ellipse(x,y,200,50,0,0,7);c.ellipse(x+120,y+10,140,40,0,0,7);c.fill();}c.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<3;i++){const x=((t*14+i*400)%1400)-200;c.beginPath();c.ellipse(x,30+i*12,90,22,0,0,7);c.ellipse(x+60,22+i*12,60,20,0,0,7);c.fill();}break;}
  case 'drizzle':case 'storm':{const n=s.k==='storm'?300:120,len=s.k==='storm'?26:14;if(P.length<n)for(let i=0;i<20;i++)P.push({x:R()*W,y:R()*H,v:600+R()*400});c.strokeStyle=s.k==='storm'?'rgba(220,235,255,.55)':'rgba(230,240,255,.4)';c.lineWidth=s.k==='storm'?1.6:1;c.beginPath();for(const p of P){p.y+=p.v*dt;p.x-=p.v*dt*.15;if(p.y>H){p.y=-20;p.x=R()*W*1.1;}const a=SAFE(p.x,p.y);if(a<.5&&R()<.6)continue;c.moveTo(p.x,p.y);c.lineTo(p.x+len*.15,p.y-len);}c.stroke();
   for(let i=0;i<(s.k==='storm'?14:6);i++){const ph=(t*1.3+i*.37)%1,x=(i*197+Math.floor(t*1.3+i*.37)*331)%W,y=130+((i*89+Math.floor(t*1.3+i*.37)*57)%260);c.strokeStyle=`rgba(255,255,255,${.5*(1-ph)})`;c.lineWidth=1.2;c.beginPath();c.ellipse(x,y,4+ph*22,1.5+ph*6,0,0,7);c.stroke();}
   c.fillStyle=s.k==='storm'?'rgba(40,50,70,.22)':'rgba(80,90,110,.1)';c.fillRect(0,0,W,H);if(s.k==='storm'){const f=(t%6);if(f<.15||(f>.3&&f<.38)){c.fillStyle='rgba(255,255,255,.35)';c.fillRect(0,0,W,H);}}break;}
  case 'rainbow':{c.save();c.globalAlpha=.42;const cols=['#ff4d4d','#ff9a3c','#ffe14d','#5fd35f','#4da6ff','#6a5cff','#b45cff'];cols.forEach((cl,i)=>{c.strokeStyle=cl;c.lineWidth=9;c.beginPath();c.arc(520,420,430-i*9,Math.PI*1.08,Math.PI*1.92);c.stroke();});c.restore();for(let i=0;i<24;i++){const x=(i*173)%W,y=130+(i*61)%200,a=(Math.sin(t*3+i)+1)/2;c.fillStyle=`rgba(255,255,255,${a*.7})`;c.beginPath();c.arc(x,y,2,0,7);c.fill();}break;}
  case 'fog':{for(let i=0;i<7;i++){const x=((t*12+i*210)%1400)-200,y=110+i*22;const g=c.createRadialGradient(x,y,10,x,y,260);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(x-260,y-90,520,180);}const g2=c.createLinearGradient(0,60,0,260);g2.addColorStop(0,'rgba(240,246,250,.55)');g2.addColorStop(1,'rgba(240,246,250,0)');c.fillStyle=g2;c.fillRect(0,0,W,280);break;}
  case 'snow':case 'petal':case 'leaf':{const n=s.k==='snow'?160:70;if(P.length<n)for(let i=0;i<10;i++)P.push({x:R()*W,y:-10-R()*H,v:40+R()*60,r:s.k==='snow'?2+R()*3:5+R()*5,a:R()*6,w:R()*2+1});for(const p of P){p.y+=p.v*dt;p.a+=dt*p.w;p.x+=Math.sin(p.a)*20*dt+(s.k==='petal'?50*dt:0);if(p.y>H+10){p.y=-10;p.x=R()*W;}const al=SAFE(p.x,p.y);c.globalAlpha=al;if(s.k==='snow'){c.fillStyle='#fff';c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();}else{c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=s.k==='petal'?'#ffb7d0':['#e8743a','#d9502a','#f0a030'][Math.floor(p.w*2)%3];c.beginPath();if(s.k==='petal'){c.ellipse(0,0,p.r,p.r*.55,0,0,7);}else{c.moveTo(0,-p.r);c.lineTo(p.r*.7,0);c.lineTo(0,p.r);c.lineTo(-p.r*.7,0);}c.fill();c.restore();}}c.globalAlpha=1;if(s.k==='snow'){c.fillStyle='rgba(225,235,248,.12)';c.fillRect(0,0,W,H);}break;}
  case 'wind':{c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=2;for(let i=0;i<22;i++){const y=120+(i*37)%250,x=((t*160+i*190)%1300)-150,l=60+(i%4)*30;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l/2,y-6,x+l,y);c.stroke();}break;}
  case 'sunset':{const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(255,120,60,.42)');g.addColorStop(.35,'rgba(255,170,90,.25)');g.addColorStop(1,'rgba(120,60,140,.18)');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='rgba(255,200,120,.6)';c.beginPath();c.arc(860,70,40,0,7);c.fill();break;}
  case 'firefly':case 'meteor':case 'aurora':{c.fillStyle='rgba(15,25,60,.55)';c.fillRect(0,0,W,H);for(let i=0;i<60;i++){const x=(i*157)%W,y=(i*53)%110,a=.5+Math.sin(t*2+i)*.4;c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect(x,y,2,2);}
   if(s.k==='firefly'){for(let i=0;i<40;i++){const x=(i*131+Math.sin(t*.7+i)*40)%W,y=160+((i*71)%300)+Math.cos(t*.9+i*2)*20,a=(Math.sin(t*2.5+i*1.7)+1)/2;const g=c.createRadialGradient(x,y,0,x,y,12);g.addColorStop(0,`rgba(230,255,120,${a})`);g.addColorStop(1,'rgba(230,255,120,0)');c.fillStyle=g;c.fillRect(x-12,y-12,24,24);}}
   if(s.k==='meteor'){const ph=t%2.5;if(ph<.8){const u=ph/.8,x=900-u*500,y=10+u*120;const g=c.createLinearGradient(x,y,x+140,y-34);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');c.strokeStyle=g;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+140,y-34);c.stroke();}}
   if(s.k==='aurora'){c.globalCompositeOperation='lighter';for(let b=0;b<3;b++){c.beginPath();for(let x=0;x<=W;x+=16){const y=40+b*24+Math.sin(x*.008+t*.6+b)*26;x?c.lineTo(x,y):c.moveTo(x,y);}c.lineTo(W,0);c.lineTo(0,0);c.closePath();const g=c.createLinearGradient(0,0,0,140);g.addColorStop(0,'rgba(80,255,170,0)');g.addColorStop(1,['rgba(80,255,170,.35)','rgba(120,140,255,.3)','rgba(200,100,255,.25)'][b]);c.fillStyle=g;c.fill();}c.globalCompositeOperation='source-over';}
   break;}
  }}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);window.READY=1;
</script><script src="lb.js"></script></body></html>
