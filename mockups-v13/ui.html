['6. 랭킹 3위 안 진입 알림',[
 ['A','상단 골드 배너','화면 위에서 내려오는 금색 배너 + 메달. 2.5초 후 자동으로 올라가요. 가장 방해가 적음.',`<div class="rA"><img class="nolb" src="../icons/emoji-png/1f948.png"><div>주간 서버 랭킹 <span style="color:#c06a00">2위</span> 진입!<small>참붕어 11.8cm · 이전 5위 → 2위</small></div></div>`,1],
 ['B','메달 컷인','중앙에 큰 메달이 회전하며 등장 → 랭킹 버튼 쪽으로 날아가며 사라짐. 1위 진입 때만 쓰면 특별함이 커요.',`<div class="rB"><div class="ray"></div><div class="md">1</div><div class="tx">이번 주 <b>붕어 랭킹 1위</b> 달성!</div></div>`],

 ['A','젤리 캔디 (상태별 색)','현재 버튼의 입체감 강화. 던지기=주황, 기다림=파랑(숨쉬기), 입질=빨강(흔들림).',`<div class="fbrow"><div><button class="fb fA">낚시 시작</button><span class="lb2">대기</span></div><div><button class="fb fA w">기다리는 중</button><span class="lb2">입질 대기</span></div><div><button class="fb fA b">지금 당겨!</button><span class="lb2">입질</span></div></div>`,1],
 ['B','원형 + 게이지 링','동그란 큰 버튼 테두리에 진행 링. 모바일 엄지 위치에 최적.',`<div class="fbrow"><div><button class="fb fB">던지기</button><span class="lb2">대기</span></div><div><button class="fb fB w">대기 중</button><span class="lb2">입질 대기</span></div><div><button class="fb fB b">당겨!</button><span class="lb2">입질</span></div></div>`],
 ['C','나무 간판','데크·나무 소재와 통일된 원목 버튼. 게임 분위기와 가장 잘 어울려요.',`<div class="fbrow"><div><button class="fb fC">낚시 시작</button><span class="lb2">대기</span></div><div><button class="fb fC w">기다리는 중</button><span class="lb2">입질 대기</span></div><div><button class="fb fC b">지금 당겨!</button><span class="lb2">입질</span></div></div>`],
 ['D','물결 채움','버튼 안에 물이 출렁이며 차오름. 입질이 가까울수록 수위가 올라가는 연출.',`<div class="fbrow"><div><button class="fb fD c"><span>낚시 시작</span></button><span class="lb2">대기</span></div><div><button class="fb fD"><span>기다리는 중</span></button><span class="lb2">입질 대기</span></div><div><button class="fb fD b"><span>지금 당겨!</span></button><span class="lb2">입질</span></div></div>`],

 ['A','트로피 카드 + 진행 바 완성','진행 바가 100%로 차오르며 트로피가 회전. 보상을 한 줄로 요약.',`<div class="gA"><img class="nolb" src="../icons/emoji-png/1f3c6.png"><div style="flex:1"><h4>수집 목표 달성</h4><b>붕어 세트 완성</b><div class="pg"><i></i></div><p>보상: 코인 500 · 강화석 3</p></div></div>`,1],
